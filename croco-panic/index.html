<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#03050a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="6つのハッチから飛び出すネオンのワニを手で叩くサイバーパンク版もぐらたたき。トラップを避けて45秒でハイスコアを狙う - CROCO PANIC">
<title>CROCO PANIC ─ 電脳ワニワニパニック</title>
<style>
  :root{
    --void:#03050a; --haze:#08160f; --ghost:#eef2ff;
    --lime:#39ff88; --magenta:#ff2bd6; --gold:#ffe066; --warn:#ff2b3d; --cyan:#39e0ff;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ width:100%; height:100%; background:var(--void); overflow:hidden;
    font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,-apple-system,'Segoe UI',sans-serif; }
  #stage{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  video{ position:absolute; width:2px; height:2px; opacity:0; pointer-events:none; }

  #scan{ position:fixed; inset:0; z-index:6; pointer-events:none; mix-blend-mode:screen; opacity:.4;
    background:repeating-linear-gradient(to bottom, rgba(150,255,200,0.05) 0px, rgba(150,255,200,0.05) 1px, transparent 2px, transparent 3px); }
  #alertFlash{ position:fixed; inset:0; z-index:7; pointer-events:none; background:rgba(255,43,61,0.0); }

  #overlay{
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 40%, var(--haze) 0%, var(--void) 78%);
    transition:opacity .6s ease, visibility .6s ease; text-align:center; padding:1.5rem;
    overflow:hidden;
  }
  #overlay.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  .orb{ position:absolute; border-radius:50%; filter:blur(44px); opacity:.34; pointer-events:none;
    animation:drift 13s ease-in-out infinite alternate; }
  .orb.o1{ width:38vmin; height:38vmin; left:8%;  top:12%; background:radial-gradient(circle,var(--lime),transparent 70%); }
  .orb.o2{ width:46vmin; height:46vmin; right:4%; top:30%; background:radial-gradient(circle,var(--magenta),transparent 70%); animation-delay:-5s; }
  .orb.o3{ width:34vmin; height:34vmin; left:30%; bottom:6%; background:radial-gradient(circle,var(--cyan),transparent 70%); animation-delay:-9s; }
  @keyframes drift{ from{ transform:translate(0,0) scale(1); } to{ transform:translate(6vmin,-4vmin) scale(1.15); } }
  #eyebrow{ color:rgba(238,242,255,0.4); font-size:0.66rem; letter-spacing:0.5em; margin-bottom:1rem; position:relative; }
  #title{
    font-size:2.1rem; font-weight:800; letter-spacing:0.08em; line-height:1.2; position:relative;
    background:linear-gradient(90deg,var(--lime),var(--cyan),var(--magenta),var(--gold),var(--lime));
    background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:flow 7s linear infinite; margin-bottom:0.4rem;
  }
  @keyframes flow{ to{ background-position:300% 0; } }
  #sub{ color:rgba(238,242,255,0.55); font-size:0.82rem; letter-spacing:0.08em; margin-bottom:1.6rem; position:relative; white-space:pre-line; }
  #startBtn{
    position:relative; padding:0.95rem 3rem; font-size:1rem; letter-spacing:0.18em; font-family:inherit; font-weight:700;
    color:var(--void); background:linear-gradient(90deg,var(--lime),var(--magenta)); border:none; border-radius:6px;
    cursor:pointer; box-shadow:0 0 28px rgba(57,255,136,0.4);
    transition:transform .18s ease, box-shadow .18s ease; animation:breathe 2.6s ease-in-out infinite;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  }
  @keyframes breathe{
    0%,100%{ box-shadow:0 0 22px rgba(57,255,136,0.4); }
    50%{ box-shadow:0 0 44px rgba(255,43,214,0.5); }
  }
  #startBtn:active{ transform:scale(0.96); }
  #hint{ position:relative; margin-top:2rem; max-width:23rem; color:rgba(238,242,255,0.5); font-size:0.76rem; line-height:1.9;
    letter-spacing:0.02em; text-align:left; }
  #hint b{ color:var(--lime); font-weight:700; }
  #hint em{ color:var(--warn); font-style:normal; font-weight:700; }
  #errorMsg{ display:none; position:relative; margin-top:1.4rem; max-width:80%; color:var(--warn); font-size:0.78rem; line-height:1.6; white-space:pre-line; }
  #resultBox{ display:none; position:relative; margin-bottom:1.6rem; }
  #resultBox .rlab{ font-size:0.62rem; letter-spacing:0.3em; color:rgba(238,242,255,0.45); }
  #resultBox .rscore{ font-size:2.6rem; font-weight:800; color:var(--gold); line-height:1.3; font-variant-numeric:tabular-nums; }
  #resultBox .rsub{ font-size:0.78rem; color:rgba(238,242,255,0.6); letter-spacing:0.05em; }

  #hud{ position:fixed; z-index:12; left:0; right:0; top:0;
    display:flex; align-items:flex-start; justify-content:space-between; padding:1.1rem 1rem 0;
    pointer-events:none; opacity:0; transition:opacity .6s ease; }
  #hud.show{ opacity:1; }
  .panel{ background:rgba(3,8,6,0.5); backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px);
    border:1px solid rgba(57,255,136,0.2); padding:0.6rem 0.9rem; color:var(--ghost); min-width:104px;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); }
  .panel .lab{ font-size:0.56rem; letter-spacing:0.22em; color:rgba(238,242,255,0.5); margin-bottom:0.25rem; }
  .panel .val{ font-size:1.5rem; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; color:var(--gold); }
  .panel[data-side="r"]{ text-align:right; }
  .panel[data-side="r"] .val{ color:var(--cyan); }
  .panel[data-side="r"] .val.low{ color:var(--warn); }
  .subLab{ font-size:0.64rem; letter-spacing:0.1em; color:rgba(238,242,255,0.5); margin-top:0.3rem; }

  #centerHud{ position:fixed; z-index:12; left:50%; bottom:1.4rem; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:.3rem; pointer-events:none;
    opacity:0; transition:opacity .6s ease; }
  #centerHud.show{ opacity:1; }
  #stateDot{ font-size:0.66rem; letter-spacing:0.16em; color:rgba(238,242,255,0.6); font-weight:700;
    padding:0.4rem 1.1rem; border-radius:100px; border:1px solid rgba(57,255,136,0.2);
    background:rgba(3,8,6,0.5); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    transition:color .2s ease, border-color .2s ease, box-shadow .2s ease; white-space:nowrap; }
  #stateDot.hot{ color:var(--gold); border-color:rgba(255,224,102,0.55); box-shadow:0 0 18px rgba(255,224,102,0.3); }
  #stateDot.warnState{ color:var(--warn); border-color:rgba(255,43,61,0.5); box-shadow:0 0 18px rgba(255,43,61,0.3); }
  #stateDot.silent{ color:rgba(150,150,170,0.8); border-color:rgba(120,120,140,0.35); box-shadow:none; }

  #topbar{ position:fixed; z-index:12; top:0; right:0; padding:1rem 1rem 0; display:flex; gap:.55rem;
    opacity:0; transition:opacity .6s ease; }
  #topbar.show{ opacity:1; }
  .btn{ pointer-events:auto; font-family:inherit; font-size:0.68rem; letter-spacing:0.1em; font-weight:700;
    color:var(--ghost); background:rgba(3,8,6,0.55); border:1px solid rgba(57,255,136,0.2);
    padding:0.5rem 0.9rem; cursor:pointer; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    transition:transform .15s ease, background .15s ease;
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px); }
  .btn:active{ transform:scale(0.94); }
  #brand{ position:fixed; z-index:12; top:0; left:0; padding:1.15rem 0 0 1.15rem; pointer-events:none;
    opacity:0; transition:opacity .6s ease; display:none; }
  #brand.show{ opacity:1; }
  #brand .b1{ font-size:0.66rem; font-weight:800; letter-spacing:0.3em; color:rgba(238,242,255,0.85); }
  #brand .b2{ font-size:0.56rem; letter-spacing:0.2em; color:rgba(238,242,255,0.4); margin-top:.2rem; }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <video id="video" playsinline muted></video>
  <div id="scan"></div>
  <div id="alertFlash"></div>

  <div id="brand"><div class="b1">CROCO PANIC</div><div class="b2">電脳ワニワニパニック</div></div>

  <div id="topbar">
    <button class="btn" id="flipBtn">⟲ カメラ</button>
  </div>

  <div id="hud">
    <div class="panel" data-side="l">
      <div class="lab">SCORE</div>
      <div class="val" id="scoreEl">0</div>
      <div class="subLab">COMBO <span id="comboEl">0</span></div>
    </div>
    <div class="panel" data-side="r">
      <div class="lab">TIME</div>
      <div class="val" id="timeEl">45</div>
      <div class="subLab">HIT <span id="hitEl">0</span> ・ MISS <span id="missEl">0</span></div>
    </div>
  </div>

  <div id="centerHud"><div id="stateDot">WAITING</div></div>

  <div id="overlay">
    <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
    <div id="eyebrow">CAMERA GAME</div>
    <div id="resultBox">
      <div class="rlab">TIME UP</div>
      <div class="rscore" id="finalScore">0</div>
      <div class="rsub" id="finalSub"></div>
    </div>
    <div id="title">CROCO PANIC</div>
    <div id="sub">インカメラの前で、電脳ワニをぶっ叩け</div>
    <button id="startBtn">はじめる</button>
    <div id="hint">
      ・6つのハッチから<b>ネオンのワニ</b>が飛び出したら、手で素早く叩く<br>
      ・<b>金色のワニ</b>は高得点ボーナス<br>
      ・<em>赤いトラップ</em>（警告ドローン）は叩くと減点＆コンボが切れる、見極めて<br>
      ・制限時間は<b>45秒</b>。時間が経つほどワニの動きが速くなる
    </div>
    <div id="errorMsg"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------------------
  //  DOM
  // ---------------------------------------------------------------------------
  const canvas   = document.getElementById('stage');
  const ctx      = canvas.getContext('2d');
  const video    = document.getElementById('video');
  const overlay  = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const errorMsg = document.getElementById('errorMsg');
  const hud      = document.getElementById('hud');
  const topbar   = document.getElementById('topbar');
  const brand    = document.getElementById('brand');
  const centerHud= document.getElementById('centerHud');
  const stateDot = document.getElementById('stateDot');
  const flipBtn  = document.getElementById('flipBtn');
  const scoreEl  = document.getElementById('scoreEl');
  const comboEl  = document.getElementById('comboEl');
  const timeEl   = document.getElementById('timeEl');
  const hitEl    = document.getElementById('hitEl');
  const missEl   = document.getElementById('missEl');
  const resultBox= document.getElementById('resultBox');
  const finalScore=document.getElementById('finalScore');
  const finalSub = document.getElementById('finalSub');
  const eyebrow  = document.getElementById('eyebrow');
  const titleEl  = document.getElementById('title');
  const subEl    = document.getElementById('sub');
  const hintEl   = document.getElementById('hint');
  const alertFlashEl = document.getElementById('alertFlash');

  const fx   = document.createElement('canvas');
  const fctx = fx.getContext('2d');

  let W = 0, H = 0, DPR = 1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    fx.width = W * DPR; fx.height = H * DPR;
    fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------------------------------------------------------------------------
  //  GAME CONSTANTS
  // ---------------------------------------------------------------------------
  const ROUND_MS = 45000;
  const HATCHES = Array.from({length:6}, (_,i) => ({ x: 0.1 + i*0.16, y: 0.6 })); // real wani-wani panic: one straight row
  const PUNCH_MIN_SPEED = 55;
  const GOLD_CHANCE = 0.1;

  function spawnIntervalAt(p){ return 680 - p*180; }   // p: 0..1 round progress — milder ramp
  function popupLifeAt(p){ return 1150 - p*300; }      // generous hang time, like the real cabinet
  function trapChanceAt(p){ return 0.08 + p*0.06; }

  // ---------------------------------------------------------------------------
  //  AUDIO ENGINE
  // ---------------------------------------------------------------------------
  let actx = null, master = null, comp = null, sfxBus = null, padBus = null;
  let convolver = null, revGain = null;
  let audioReady = false;
  let droneOsc = null, droneGain = null;

  function makeImpulse(seconds, decayPow){
    const rate = actx.sampleRate, len = Math.floor(rate*seconds);
    const buf = actx.createBuffer(2, len, rate);
    for (let ch=0; ch<2; ch++){
      const d = buf.getChannelData(ch);
      for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, decayPow);
    }
    return buf;
  }
  function makeNoiseBuffer(seconds){
    const rate = actx.sampleRate, len = Math.floor(rate*seconds);
    const buf = actx.createBuffer(1, len, rate);
    const d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
    return buf;
  }
  const noiseBuf = { buf: null };

  function buildAudio(){
    if (audioReady) return;
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.9;
    comp = actx.createDynamicsCompressor();
    comp.threshold.value=-16; comp.knee.value=20; comp.ratio.value=3.4; comp.attack.value=0.004; comp.release.value=0.22;

    convolver = actx.createConvolver(); convolver.buffer = makeImpulse(1.1, 2.8);
    revGain = actx.createGain(); revGain.gain.value = 0.2;

    sfxBus = actx.createGain(); sfxBus.gain.value = 1.0;
    padBus = actx.createGain(); padBus.gain.value = 0.5;

    sfxBus.connect(master); sfxBus.connect(convolver);
    padBus.connect(master); padBus.connect(convolver);
    convolver.connect(revGain); revGain.connect(master);
    master.connect(comp); comp.connect(actx.destination);

    noiseBuf.buf = makeNoiseBuffer(0.6);

    // low cyberpunk drone bed
    droneOsc = actx.createOscillator(); droneOsc.type = 'sawtooth'; droneOsc.frequency.value = 55;
    const droneFilter = actx.createBiquadFilter(); droneFilter.type='lowpass'; droneFilter.frequency.value = 220; droneFilter.Q.value=2;
    droneGain = actx.createGain(); droneGain.gain.value = 0.06;
    droneOsc.connect(droneFilter); droneFilter.connect(droneGain); droneGain.connect(padBus);
    droneOsc.start();

    audioReady = true;
  }

  function pop(t, hue){
    if (!audioReady) return;
    const o = actx.createOscillator(); o.type = 'square';
    o.frequency.setValueAtTime(hue, t);
    o.frequency.exponentialRampToValueAtTime(hue*2.2, t+0.08);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.14, t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.1);
    o.connect(g); g.connect(padBus);
    o.start(t); o.stop(t+0.12);
  }

  function chomp(t, gold){
    if (!audioReady) return;
    const src = actx.createBufferSource(); src.buffer = noiseBuf.buf;
    const bp = actx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value = 1.4;
    bp.frequency.setValueAtTime(gold ? 2200 : 1400, t);
    bp.frequency.exponentialRampToValueAtTime(260, t+0.13);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.55, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.15);
    src.connect(bp); bp.connect(g); g.connect(sfxBus);
    src.start(t); src.stop(t+0.18);

    const click = actx.createOscillator(); click.type='square'; click.frequency.setValueAtTime(90, t);
    const cg = actx.createGain();
    cg.gain.setValueAtTime(0.3, t);
    cg.gain.exponentialRampToValueAtTime(0.0001, t+0.05);
    click.connect(cg); cg.connect(sfxBus);
    click.start(t); click.stop(t+0.06);

    if (gold){
      [0,4,7,12].forEach((semi,i) => {
        const o = actx.createOscillator(); o.type='triangle';
        o.frequency.value = 523*Math.pow(2,semi/12);
        const gg = actx.createGain();
        const st = t + i*0.045;
        gg.gain.setValueAtTime(0.0001, st);
        gg.gain.exponentialRampToValueAtTime(0.16, st+0.015);
        gg.gain.exponentialRampToValueAtTime(0.0001, st+0.3);
        o.connect(gg); gg.connect(sfxBus);
        o.start(st); o.stop(st+0.32);
      });
    }
  }

  function alertBuzz(t){
    if (!audioReady) return;
    for (const detune of [0, 7]){
      const o = actx.createOscillator(); o.type='sawtooth';
      o.frequency.value = 140 * Math.pow(2, detune/12);
      const g = actx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.28);
      o.connect(g); g.connect(sfxBus);
      o.start(t); o.stop(t+0.3);
    }
  }

  function tickWarn(t){
    if (!audioReady) return;
    const o = actx.createOscillator(); o.type='sine'; o.frequency.value = 880;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.09);
    o.connect(g); g.connect(sfxBus);
    o.start(t); o.stop(t+0.1);
  }

  function comboStinger(t){
    if (!audioReady) return;
    [0,4,7,12].forEach((semi,i) => {
      const o = actx.createOscillator(); o.type='triangle';
      o.frequency.value = 440*Math.pow(2,semi/12);
      const g = actx.createGain();
      const st = t + i*0.05;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(0.16, st+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, st+0.3);
      o.connect(g); g.connect(sfxBus);
      o.start(st); o.stop(st+0.32);
    });
  }

  function gameOverSound(t){
    if (!audioReady) return;
    [0,-3,-7].forEach((semi,i) => {
      const o = actx.createOscillator(); o.type='sawtooth';
      o.frequency.value = 220*Math.pow(2,semi/12);
      const g = actx.createGain();
      const st = t + i*0.18;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(0.22, st+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, st+0.5);
      o.connect(g); g.connect(sfxBus);
      o.start(st); o.stop(st+0.52);
    });
  }

  // ---------------------------------------------------------------------------
  //  HAND TRACKING
  // ---------------------------------------------------------------------------
  const RESULT = { hands: [], t: 0 };

  let hands = null;
  function initHands(){
    hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
    hands.setOptions({ maxNumHands:2, modelComplexity:0, minDetectionConfidence:0.6, minTrackingConfidence:0.5 });
    hands.onResults(onHandResults);
  }
  function onHandResults(results){
    const out = [];
    const lms = results.multiHandLandmarks || [];
    for (let i=0;i<lms.length;i++){
      const c = lms[i][9]; // palm center landmark
      out.push({ x:c.x, y:c.y });
    }
    RESULT.hands = out;
    RESULT.t = performance.now();
  }

  // ---------------------------------------------------------------------------
  //  CAMERA
  // ---------------------------------------------------------------------------
  let mpCamera = null, facing = 'user', mirror = true, running = false;

  async function startStream(){
    if (video.srcObject) video.srcObject.getTracks().forEach(t=>t.stop());
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facing }, width:{ ideal:1280 }, height:{ ideal:720 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    mirror = (facing === 'user');
  }
  async function startCameraLoop(){
    if (mpCamera) { mpCamera.stop && mpCamera.stop(); mpCamera = null; }
    mpCamera = new Camera(video, {
      onFrame: async () => { if (running) await hands.send({ image: video }); },
      width: 1280, height: 720
    });
    mpCamera.start();
  }
  async function flipCamera(){
    facing = (facing === 'user') ? 'environment' : 'user';
    try { await startStream(); } catch(e){ /* keep previous */ }
  }
  flipBtn.addEventListener('click', flipCamera);

  function px(pt){ return mirror ? (1 - pt.x) * W : pt.x * W; }
  function py(pt){ return pt.y * H; }

  // ---------------------------------------------------------------------------
  //  RENDER — video base
  // ---------------------------------------------------------------------------
  function drawVideoBase(){
    ctx.save();
    if (mirror){ ctx.translate(W, 0); ctx.scale(-1, 1); }
    const vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
    const scale = Math.max(W / vw, H / vh);
    const dw = vw * scale, dh = vh * scale;
    const dx = (W - dw) / 2, dy = (H - dh) / 2;
    try { ctx.drawImage(video, dx, dy, dw, dh); } catch(e){}
    ctx.restore();

    ctx.fillStyle = 'rgba(2,5,4,0.5)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = 'rgba(8,35,25,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';

    const vg = ctx.createRadialGradient(W/2, H*0.46, Math.min(W,H)*0.2, W/2, H*0.5, Math.max(W,H)*0.76);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(1,2,3,0.86)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }

  // ---------------------------------------------------------------------------
  //  GAME STATE
  // ---------------------------------------------------------------------------
  let state = 'idle'; // idle | countdown | playing | over
  let score = 0, combo = 0, maxCombo = 0, hitCount = 0, missCount = 0, trapHitCount = 0;
  let occupants = []; // one per hatch slot, or null
  let roundStart = 0, timeLeft = ROUND_MS;
  let nextSpawnAt = 0, countdownStart = 0;
  const popups = [];
  const bursts = [];
  let shake = 0, alertGlow = 0;
  let lastTickSecond = -1;

  function freeHatches(){
    return HATCHES.map((h,i)=>i).filter(i => !occupants[i]);
  }
  function spawnOccupant(p){
    const free = freeHatches();
    if (!free.length) return;
    const slot = free[(Math.random()*free.length)|0];
    const isTrap = Math.random() < trapChanceAt(p);
    const isGold = !isTrap && Math.random() < GOLD_CHANCE;
    const life = popupLifeAt(p);
    occupants[slot] = {
      slot, born: performance.now(), life,
      kind: isTrap ? 'trap' : (isGold ? 'gold' : 'croc'),
      resolved: false
    };
    if (audioReady) pop(actx.currentTime, isTrap ? 220 : (isGold ? 660 : 400));
  }

  // real whack-a-mole cadence: snap up fast, hold at full height, snap back down —
  // not a slow sine ease that's barely ever at a stable, hittable height.
  const POP_RISE = 0.16, POP_FALL_START = 0.72;
  function popScale(occ, now){
    const p = Math.min(1, (now - occ.born) / occ.life);
    if (p < POP_RISE){
      const q = p / POP_RISE;
      return 1 - Math.pow(1-q, 3); // fast ease-out rise
    }
    if (p < POP_FALL_START) return 1; // held fully up — the real hit window
    const q = (p - POP_FALL_START) / (1 - POP_FALL_START);
    return 1 - q*q; // quick ease-in drop
  }

  function spawnPopup(x, y, text, color){
    popups.push({ x, y, text, color, life: 1, vy: -0.6 });
  }
  function spawnBurst(x, y, hue, n){
    for (let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2, s = 2+Math.random()*5;
      bursts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, hue });
    }
  }

  function registerHit(occ, hx, hy, now){
    occ.resolved = true;
    occupants[occ.slot] = null;
    hitCount++;
    if (occ.kind === 'trap'){
      trapHitCount++;
      combo = 0;
      score = Math.max(0, score - 150);
      spawnPopup(hx, hy, 'TRAP!', '#ff2b3d');
      spawnBurst(hx, hy, 355, 18);
      shake = 8; alertGlow = 1;
      if (audioReady) alertBuzz(actx.currentTime);
    } else if (occ.kind === 'gold'){
      combo++; maxCombo = Math.max(maxCombo, combo);
      score += 500 + combo*8;
      spawnPopup(hx, hy, '+' + (500 + combo*8), '#ffe066');
      spawnBurst(hx, hy, 50, 30);
      shake = 5;
      if (audioReady){ chomp(actx.currentTime, true); }
    } else {
      combo++; maxCombo = Math.max(maxCombo, combo);
      const pts = 100 + combo*4;
      score += pts;
      spawnPopup(hx, hy, '+' + pts, '#39ff88');
      spawnBurst(hx, hy, 140, 16);
      shake = 3;
      if (audioReady) chomp(actx.currentTime, false);
    }
    if (combo>0 && combo % 10 === 0 && audioReady) comboStinger(actx.currentTime);
    scoreEl.textContent = score;
    comboEl.textContent = combo;
    hitEl.textContent = hitCount - trapHitCount;
  }

  function registerMiss(occ){
    if (state !== 'playing') return;
    if (occ.kind !== 'trap'){
      missCount++;
      combo = 0;
      comboEl.textContent = combo;
      missEl.textContent = missCount;
    }
    occupants[occ.slot] = null;
  }

  function resetGame(){
    score = 0; combo = 0; maxCombo = 0; hitCount = 0; missCount = 0; trapHitCount = 0;
    occupants = new Array(HATCHES.length).fill(null);
    popups.length = 0; bursts.length = 0;
    scoreEl.textContent = '0'; comboEl.textContent = '0'; hitEl.textContent = '0'; missEl.textContent = '0';
    timeEl.textContent = Math.ceil(ROUND_MS/1000);
    timeEl.classList.remove('low');
    lastTickSecond = Math.ceil(ROUND_MS/1000);
  }

  const COUNTDOWN_LABELS = ['3','2','1','START!'];
  const COUNTDOWN_STEP = 650;
  function startGame(){
    resetGame();
    state = 'countdown';
    countdownStart = performance.now();
  }

  function endGame(){
    if (state !== 'playing') return;
    state = 'over';
    if (audioReady) gameOverSound(actx.currentTime);
    const totalAttempts = hitCount - trapHitCount + missCount;
    const acc = totalAttempts>0 ? Math.round(((hitCount-trapHitCount)/totalAttempts)*100) : 0;
    finalScore.textContent = score;
    finalSub.textContent = `最大コンボ ${maxCombo} ・ HIT ${hitCount-trapHitCount} ・ MISS ${missCount} ・ トラップ誤爆 ${trapHitCount} ・ 命中率 ${acc}%`;
    resultBox.style.display = 'block';
    eyebrow.style.display = 'none';
    titleEl.textContent = 'TIME UP';
    subEl.textContent = '';
    hintEl.style.display = 'none';
    startBtn.textContent = 'もう一度';
    overlay.classList.remove('hidden');
  }

  // ---------------------------------------------------------------------------
  //  RENDER — hatches & occupants
  // ---------------------------------------------------------------------------
  function drawHatches(now){
    const c = fctx;
    c.save(); c.globalCompositeOperation = 'lighter';
    const r = Math.max(46, Math.min(W,H)*0.09);
    for (let i=0;i<HATCHES.length;i++){
      const cx = HATCHES[i].x*W, cy = HATCHES[i].y*H;
      c.strokeStyle = 'hsla(150,90%,55%,0.35)';
      c.lineWidth = 2; c.shadowBlur = 8; c.shadowColor = 'rgba(57,255,136,0.4)';
      c.beginPath(); c.ellipse(cx, cy, r, r*0.4, 0, 0, Math.PI*2); c.stroke();
      c.fillStyle = 'rgba(4,10,8,0.6)';
      c.beginPath(); c.ellipse(cx, cy, r*0.92, r*0.36, 0, 0, Math.PI*2); c.fill();

      const occ = occupants[i];
      if (occ && !occ.resolved){
        const s = popScale(occ, now);
        drawOccupant(c, cx, cy, r, occ, s);
      }
    }
    c.shadowBlur = 0;
    c.restore();
  }

  function drawOccupant(c, cx, cy, r, occ, s){
    const lift = r*1.5*s;
    const y = cy - lift;
    const scaleY = 0.4 + 0.6*s;

    c.save();
    c.translate(cx, y);
    c.scale(1, scaleY);

    if (occ.kind === 'trap'){
      const hue = 350;
      c.rotate(Math.sin(performance.now()*0.01)*0.15);
      c.shadowBlur = 20; c.shadowColor = `hsla(${hue},100%,55%,0.9)`;
      c.strokeStyle = `hsla(${hue},95%,62%,0.95)`;
      c.lineWidth = 3;
      c.beginPath();
      c.moveTo(0, -r*0.75); c.lineTo(r*0.68, r*0.5); c.lineTo(-r*0.68, r*0.5); c.closePath();
      c.stroke();
      c.fillStyle = `hsla(${hue},100%,20%,0.5)`;
      c.fill();
      c.fillStyle = `hsla(${hue},100%,75%,0.95)`;
      c.font = `800 ${r*0.7}px sans-serif`;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText('!', 0, r*0.06);
    } else {
      const gold = occ.kind === 'gold';
      const hue = gold ? 48 : 150;
      const hue2 = gold ? 320 : 300;
      c.shadowBlur = 18; c.shadowColor = `hsla(${hue},100%,55%,0.85)`;
      // head wedge
      c.fillStyle = `hsla(${hue},90%,${gold?55:45}%,0.9)`;
      c.strokeStyle = `hsla(${hue},100%,75%,1)`;
      c.lineWidth = 2.4;
      c.beginPath();
      c.moveTo(-r*0.62, r*0.3);
      c.lineTo(-r*0.5, -r*0.55);
      c.lineTo(0, -r*0.82);
      c.lineTo(r*0.5, -r*0.55);
      c.lineTo(r*0.62, r*0.3);
      c.lineTo(0, r*0.55);
      c.closePath();
      c.fill(); c.stroke();

      // teeth
      c.fillStyle = `hsla(${hue2},80%,85%,0.9)`;
      for (const dx of [-0.32,-0.1,0.1,0.32]){
        c.beginPath();
        c.moveTo(dx*r, r*0.15); c.lineTo(dx*r-r*0.06, r*0.4); c.lineTo(dx*r+r*0.06, r*0.4);
        c.closePath(); c.fill();
      }
      // eyes
      c.fillStyle = `hsla(${hue2},100%,70%,1)`;
      c.beginPath(); c.arc(-r*0.22,-r*0.32,r*0.1,0,Math.PI*2); c.fill();
      c.beginPath(); c.arc(r*0.22,-r*0.32,r*0.1,0,Math.PI*2); c.fill();
    }
    c.restore();
  }

  function drawCountdown(label, q){
    // q: 0..1 progress through this step — punch in, hold, fade out
    const scale = 1 + (1-Math.min(1, q/0.3))*0.6;
    const alpha = q > 0.75 ? 1 - (q-0.75)/0.25 : 1;
    const cx = W/2, cy = H*0.42;
    ctx.save();
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.font = '800 88px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowBlur = 30; ctx.shadowColor = 'rgba(57,255,136,0.9)';
    ctx.fillStyle = '#39ff88';
    ctx.fillText(label, 0, 0);
    ctx.restore();
  }

  function updateDrawPopups(){
    for (let i=popups.length-1;i>=0;i--){
      const p = popups[i];
      p.y += p.vy; p.life -= 0.02;
      if (p.life<=0){ popups.splice(i,1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.font = '800 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowBlur = 10; ctx.shadowColor = p.color;
      ctx.fillText(p.text, p.x, p.y);
      ctx.restore();
    }
  }
  function updateDrawBursts(){
    fctx.save(); fctx.globalCompositeOperation = 'lighter';
    for (let i=bursts.length-1;i>=0;i--){
      const b = bursts[i];
      b.x += b.vx; b.y += b.vy; b.vx*=0.93; b.vy*=0.93; b.life -= 0.03;
      if (b.life<=0){ bursts.splice(i,1); continue; }
      fctx.fillStyle = `hsla(${b.hue},100%,68%,${b.life})`;
      fctx.beginPath(); fctx.arc(b.x,b.y,3*b.life+1,0,Math.PI*2); fctx.fill();
    }
    fctx.restore();
  }

  // ---------------------------------------------------------------------------
  //  MAIN LOOP
  // ---------------------------------------------------------------------------
  let prevHands = [];

  function frame(){
    requestAnimationFrame(frame);
    const t = performance.now();

    ctx.clearRect(0,0,W,H);
    ctx.save();
    if (shake > 0.2){
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
      shake *= 0.85;
    }
    drawVideoBase();

    fctx.save();
    fctx.setTransform(1,0,0,1,0,0);
    fctx.globalCompositeOperation = 'destination-out';
    fctx.fillStyle = 'rgba(0,0,0,0.24)';
    fctx.fillRect(0,0,fx.width,fx.height);
    fctx.restore();

    const fresh = (t - RESULT.t) < 400;
    const handsNow = fresh ? RESULT.hands : [];
    const handPts = handsNow.map(h => ({ x: px(h), y: py(h) }));
    const speeds = handPts.map((h,i) => {
      const prev = prevHands[i];
      return prev ? Math.hypot(h.x-prev.x, h.y-prev.y) : 0;
    });

    if (state === 'countdown'){
      const el = t - countdownStart;
      const idx = Math.floor(el / COUNTDOWN_STEP);
      if (idx < COUNTDOWN_LABELS.length){
        const q = (el % COUNTDOWN_STEP) / COUNTDOWN_STEP;
        drawCountdown(COUNTDOWN_LABELS[idx], q);
      } else {
        state = 'playing';
        roundStart = t;
        nextSpawnAt = t + 300;
      }
    }

    if (state === 'playing'){
      const elapsed = t - roundStart;
      timeLeft = Math.max(0, ROUND_MS - elapsed);
      const progress = Math.min(1, elapsed/ROUND_MS);

      if (t >= nextSpawnAt){
        spawnOccupant(progress);
        nextSpawnAt = t + spawnIntervalAt(progress) + Math.random()*120;
      }

      const r = Math.max(46, Math.min(W,H)*0.09);
      for (const occ of occupants){
        if (!occ || occ.resolved) continue;
        const cx = HATCHES[occ.slot].x*W, cy = HATCHES[occ.slot].y*H;
        const s = popScale(occ, t);
        const liftY = cy - r*1.5*s;
        for (let i=0;i<handPts.length;i++){
          const hp2 = handPts[i];
          const d = Math.hypot(hp2.x-cx, hp2.y-liftY);
          if (d < r*0.95 && speeds[i] > PUNCH_MIN_SPEED){
            registerHit(occ, cx, liftY, t);
            break;
          }
        }
      }
      for (const occ of occupants){
        if (occ && !occ.resolved && (t - occ.born) >= occ.life){
          registerMiss(occ);
        }
      }

      const sec = Math.ceil(timeLeft/1000);
      if (sec !== lastTickSecond){
        lastTickSecond = sec;
        timeEl.textContent = sec;
        timeEl.classList.toggle('low', sec <= 10);
        if (sec <= 10 && sec > 0 && audioReady) tickWarn(actx.currentTime);
      }
      if (timeLeft <= 0) endGame();
    }

    alertGlow *= 0.9;
    alertFlashEl.style.background = `rgba(255,43,61,${alertGlow*0.28})`;

    drawHatches(t);
    updateDrawBursts();

    ctx.save();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalCompositeOperation = 'screen';
    ctx.drawImage(fx, 0, 0);
    ctx.restore();

    // hand markers
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i=0;i<handPts.length;i++){
      const h = handPts[i];
      const rr = 8 + Math.min(14, speeds[i]*0.3);
      const g = ctx.createRadialGradient(h.x,h.y,0,h.x,h.y,rr*2.2);
      g.addColorStop(0, 'hsla(150,100%,85%,0.85)');
      g.addColorStop(1, 'hsla(150,100%,60%,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(h.x,h.y,rr*2.2,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();

    updateDrawPopups();

    prevHands = handPts;
    ctx.restore(); // shake transform

    if (state === 'playing'){
      if (alertGlow > 0.15){
        stateDot.textContent = '⚠ トラップに注意！';
        stateDot.className = 'warnState';
      } else if (combo >= 8){
        stateDot.textContent = `🔥 COMBO ${combo}`;
        stateDot.className = 'hot';
      } else {
        stateDot.textContent = handPts.length ? 'ワニを叩け！' : '手をカメラに映してください';
        stateDot.className = handPts.length ? '' : 'silent';
      }
    }
  }

  // ---------------------------------------------------------------------------
  //  BOOT
  // ---------------------------------------------------------------------------
  let booted = false;
  async function boot(){
    startBtn.disabled = true;
    startBtn.textContent = '起動中…';
    try {
      if (!booted){
        if (typeof Hands === 'undefined' || typeof Camera === 'undefined'){
          throw new Error('手検出ライブラリ（MediaPipe）を読み込めませんでした。オンライン環境で開いてください。');
        }
        buildAudio();
        if (actx.state === 'suspended') await actx.resume();
        if (!hands) initHands();
        await startStream();
        await startCameraLoop();
        running = true;
        booted = true;
        requestAnimationFrame(frame);
      } else {
        if (actx.state === 'suspended') await actx.resume();
      }

      overlay.classList.add('hidden');
      hud.classList.add('show');
      topbar.classList.add('show');
      centerHud.classList.add('show');
      resultBox.style.display = 'none';
      eyebrow.style.display = 'block';
      titleEl.textContent = 'CROCO PANIC';
      subEl.textContent = 'インカメラの前で、電脳ワニをぶっ叩け';
      hintEl.style.display = 'block';
      startBtn.textContent = 'はじめる';
      startBtn.disabled = false;
      startGame();
    } catch(err){
      startBtn.disabled = false;
      startBtn.textContent = 'はじめる';
      errorMsg.style.display = 'block';
      errorMsg.textContent = 'カメラを起動できませんでした：' + (err && err.message ? err.message : err) +
        '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
    }
  }
  startBtn.addEventListener('click', boot);
})();
</script>
</body>
</html>
