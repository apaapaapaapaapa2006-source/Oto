<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="ブラウザで動くモーションデザイン編集アプリ">
<title>Motion Editor</title>
<style>
:root{
  --bg:#0e0f13; --panel:#16171d; --panel2:#1d1f26; --panel3:#252832; --line:#2c2f3a; --text:#e9eaf0; --muted:#9aa0b0; --dim:#6b7080;
  --accent:#5b8cff; --accent-d:#3d6ef0; --kf:#ffc94d; --danger:#ff5d6c; --ok:#3ccf8e; --warn:#ffb547;
  --tap:44px; --sheet-h:52vh;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden; overscroll-behavior:none; }
body{ font:14px/1.45 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Segoe UI",system-ui,sans-serif;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent; }
#app{ position:fixed; inset:0; height:100vh; height:100dvh; display:flex; flex-direction:column;
  padding:var(--sat) var(--sar) 0 var(--sal); user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:manipulation; }
input,textarea,select{ font:inherit; font-size:16px; color:var(--text); background:var(--panel3); border:1px solid var(--line); border-radius:8px;
  user-select:text; -webkit-user-select:text; -webkit-touch-callout:default; }
input,select{ height:40px; padding:0 8px; min-width:0; }
textarea{ padding:8px; resize:vertical; width:100%; min-height:72px; }
input[type=color]{ padding:2px; width:52px; height:40px; background:var(--panel3); }
input[type=range]{ height:40px; padding:0; border:0; background:transparent; accent-color:var(--accent); }
input[type=checkbox]{ width:22px; height:22px; accent-color:var(--accent); }
input:focus,textarea:focus,select:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
button{ font:inherit; color:var(--text); background:var(--panel3); border:1px solid var(--line); border-radius:10px; min-width:var(--tap); min-height:var(--tap);
  padding:0 12px; cursor:pointer; touch-action:manipulation; display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; }
button:hover{ border-color:#3c4150; }
button:active{ background:#2d3140; }
button:disabled{ opacity:.38; cursor:default; }
button.primary{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
button.primary:active{ background:var(--accent-d); }
button.danger{ color:#ffd5da; border-color:#5a2a33; background:#2a1a1f; }
button.ghost{ background:transparent; border-color:transparent; }
button.icon{ padding:0; width:var(--tap); font-size:18px; }
button.on{ background:#24345e; border-color:var(--accent); color:#cfe0ff; }
.svgi{ width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

/* top bar */
#topbar{ flex:none; display:flex; align-items:center; gap:4px; padding:4px 6px; background:var(--panel); border-bottom:1px solid var(--line); min-height:52px; }
#topbar .title{ flex:1; min-width:0; display:flex; flex-direction:column; padding:0 4px; overflow:hidden; }
#projName{ font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#saveStatus{ font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#saveStatus.dirty{ color:var(--warn); } #saveStatus.err{ color:var(--danger); }

#main{ flex:1; min-height:0; display:grid; grid-template-columns:1fr; }
#leftCol,#rightCol{ display:none; }
#center{ display:flex; flex-direction:column; min-height:0; min-width:0; }

/* preview */
#previewWrap{ position:relative; flex:0 0 auto; height:36vh; height:36dvh; min-height:150px; background:#08090c; overflow:hidden; touch-action:none; }
#stage{ position:absolute; background:#000; box-shadow:0 0 0 1px #2a2d38; }
#overlay{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
#emptyHint{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); color:var(--muted); font-size:13px; text-align:center; pointer-events:none; line-height:1.7; padding:8px 14px; background:rgba(14,15,19,.72); border-radius:10px; }

/* transport */
#transport{ flex:none; display:flex; align-items:center; gap:2px; padding:2px 6px; background:var(--panel); border-top:1px solid var(--line); overflow-x:auto; scrollbar-width:none; }
#transport::-webkit-scrollbar{ display:none; }
#timeReadout{ margin-left:auto; text-align:right; font-variant-numeric:tabular-nums; font-size:13px; line-height:1.25; padding:0 4px; white-space:nowrap; }
#timeReadout small{ color:var(--muted); font-size:11px; display:block; }

/* timeline */
#timeline{ flex:1 1 auto; min-height:0; display:grid; grid-template-columns:var(--tl-label,92px) 1fr; grid-template-rows:44px 44px 1fr;
  background:var(--panel); border-top:1px solid var(--line); touch-action:none; position:relative; overflow:hidden; }
.tl-corner{ display:flex; align-items:center; border-right:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--panel2); }
.tl-corner button{ border:0; border-radius:0; background:transparent; flex:1; min-width:0; font-size:18px; }
.tl-ruler{ position:relative; border-bottom:1px solid var(--line); background:var(--panel2); cursor:ew-resize; overflow:hidden; }
.tl-ruler canvas{ position:absolute; inset:0; width:100%; height:100%; }
.tl-scenelabel{ display:flex; align-items:center; justify-content:space-between; white-space:nowrap; padding:0 0 0 8px; font-size:12px; color:var(--muted); border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
.tl-scenes{ position:relative; overflow:hidden; border-bottom:1px solid var(--line); }
.tl-labels{ position:relative; overflow:hidden; border-right:1px solid var(--line); }
.tl-tracks{ position:relative; overflow:hidden; }
.tl-inner{ position:absolute; left:0; top:0; will-change:transform; }
.tl-row{ position:absolute; left:0; height:44px; }
.tl-row.kfrow{ height:40px; }
.tl-label{ position:absolute; left:0; right:0; height:44px; display:flex; align-items:center; padding:0 6px 0 8px; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-bottom:1px solid #20222a; }
.tl-label.kfrow{ height:40px; padding-left:18px; color:var(--muted); font-size:11px; }
.tl-label.sel{ background:#1d2740; color:#dbe6ff; }
.tl-label span{ overflow:hidden; text-overflow:ellipsis; }
.tl-rowbg{ position:absolute; left:0; height:44px; border-bottom:1px solid #20222a; }
.tl-rowbg.kfrow{ height:40px; background:#14151a; }
.scene-block{ position:absolute; top:5px; height:34px; border-radius:8px; background:#26304a; border:1px solid #3a4a72; color:#cdd8f5; font-size:12px; display:flex; align-items:center; padding:0 10px; overflow:hidden; white-space:nowrap; touch-action:none; }
.scene-block.cur{ background:#30406a; border-color:var(--accent); color:#fff; }
.scene-edge{ position:absolute; top:0; width:28px; height:44px; margin-left:-14px; cursor:ew-resize; touch-action:none; z-index:3; display:flex; justify-content:center; }
.scene-edge::after{ content:""; width:4px; height:26px; margin-top:9px; border-radius:2px; background:#8ea6e6; }
.lbar{ position:absolute; top:6px; height:32px; border-radius:7px; background:#2c3242; border:1px solid #3d4457; color:#d7dbe6; font-size:11px; display:flex; align-items:center; overflow:visible; touch-action:none; cursor:grab; }
.lbar .nm{ padding:0 14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none; }
.lbar.sel{ background:#2e4472; border-color:var(--accent); color:#fff; }
.lbar.hidden{ opacity:.45; }
.lbar.t-text{ border-left:3px solid #c8a2ff; } .lbar.t-shape{ border-left:3px solid #5bd6ff; } .lbar.t-image{ border-left:3px solid #6fe39a; } .lbar.t-cursor{ border-left:3px solid #ffb35b; }
.lbar .edge{ position:absolute; top:-6px; width:26px; height:44px; cursor:ew-resize; touch-action:none; display:flex; justify-content:center; align-items:center; }
.lbar .edge.l{ left:-10px; } .lbar .edge.r{ right:-10px; }
.lbar .edge::after{ content:""; width:4px; height:18px; border-radius:2px; background:rgba(255,255,255,.55); }
.lbar .mini{ position:absolute; top:50%; width:7px; height:7px; margin:-3.5px 0 0 -3.5px; transform:rotate(45deg); background:var(--kf); opacity:.85; pointer-events:none; }
.kfd{ position:absolute; top:2px; width:36px; height:36px; margin-left:-18px; display:flex; align-items:center; justify-content:center; touch-action:none; cursor:ew-resize; z-index:2; }
.kfd::after{ content:""; width:12px; height:12px; transform:rotate(45deg); background:var(--kf); border:1px solid #6a4e00; border-radius:2px; }
.kfd.sel::after{ background:#fff; border-color:var(--accent); box-shadow:0 0 0 3px rgba(91,140,255,.6); }
.kfd.click::after{ border-radius:50%; transform:none; background:#ff8f5b; }
.kfd.pt::after{ border-radius:50%; transform:none; background:#ffb35b; width:10px; height:10px; }
.tl-playhead{ position:absolute; top:0; bottom:0; width:2px; margin-left:-1px; background:#ff5d6c; pointer-events:none; z-index:5; }
.tl-playhead::before{ content:""; position:absolute; top:0; left:-6px; width:14px; height:12px; background:#ff5d6c; clip-path:polygon(0 0,100% 0,50% 100%); }
.tl-endshade{ position:absolute; top:0; bottom:0; background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 6px,transparent 6px 12px); pointer-events:none; }
.tl-scenerange{ position:absolute; top:0; bottom:0; background:rgba(91,140,255,.05); border-left:1px dashed rgba(91,140,255,.35); border-right:1px dashed rgba(91,140,255,.35); pointer-events:none; }

/* tab bar + bottom sheet (portrait) */
#tabbar{ flex:none; display:flex; background:var(--panel); border-top:1px solid var(--line); padding:0 var(--sar) var(--sab) var(--sal); z-index:30; }
#tabbar button{ flex:1; min-width:0; border:0; border-radius:0; background:transparent; flex-direction:column; gap:1px; height:56px; font-size:11px; color:var(--muted); padding:4px 0; }
#tabbar button.on{ color:#dbe6ff; background:#1c2335; }
#tabbar .svgi{ width:22px; height:22px; }
#sheet{ position:fixed; left:0; right:0; bottom:calc(57px + var(--sab)); height:var(--sheet-h); background:var(--panel); border-top:1px solid var(--line);
  border-radius:16px 16px 0 0; box-shadow:0 -10px 30px rgba(0,0,0,.45); transform:translateY(calc(100% + 80px)); transition:transform .22s ease, height .22s ease; z-index:25;
  display:flex; flex-direction:column; padding-left:var(--sal); padding-right:var(--sar); }
#sheet.open{ transform:none; }
#sheet.full{ height:calc(100dvh - 120px - var(--sat) - var(--sab)); }
.sheet-handle{ flex:none; height:28px; display:flex; align-items:center; justify-content:center; touch-action:none; cursor:ns-resize; }
.sheet-handle::after{ content:""; width:44px; height:5px; border-radius:3px; background:#3b3f4c; }
.sheet-body,.side-body{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y; padding:4px 12px 24px; }
.side-tabs{ flex:none; display:flex; border-bottom:1px solid var(--line); background:var(--panel2); }
.side-tabs button{ flex:1; min-width:0; border:0; border-radius:0; background:transparent; font-size:12px; color:var(--muted); padding:0 4px; }
.side-tabs button.on{ color:#fff; box-shadow:inset 0 -2px 0 var(--accent); }
.side-head{ flex:none; padding:12px 12px 8px; font-weight:700; border-bottom:1px solid var(--line); background:var(--panel2); }

/* landscape / PC: 3 columns */
@media (orientation:landscape) and (min-width:640px), (min-width:1024px){
  #app{ padding-bottom:var(--sab); }
  #main{ grid-template-columns:minmax(210px,22%) minmax(0,1fr) minmax(250px,27%); }
  #leftCol,#rightCol{ display:flex; flex-direction:column; min-height:0; background:var(--panel); }
  #leftCol{ border-right:1px solid var(--line); } #rightCol{ border-left:1px solid var(--line); }
  #tabbar,#sheet{ display:none; }
  #previewWrap{ flex:1 1 auto; height:auto; min-height:120px; }
  #timeline{ flex:0 0 auto; height:clamp(160px,38%,380px); --tl-label:132px; }
}

/* panels */
.pnl h3{ font-size:12px; color:var(--muted); font-weight:700; margin:16px 0 6px; letter-spacing:.04em; display:flex; align-items:center; gap:4px; }
.pnl h3:first-child{ margin-top:6px; }
.pnl .hint{ color:var(--muted); font-size:12px; margin:6px 0; line-height:1.6; }
.pnl .note{ color:var(--dim); font-size:12px; margin:10px 0; line-height:1.6; }
.row{ display:flex; align-items:center; gap:6px; min-height:44px; }
.row > label.lab{ flex:0 0 84px; font-size:12px; color:#c4c8d4; cursor:ew-resize; touch-action:none; padding:12px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row > label.lab.static{ cursor:default; }
.row .grow{ flex:1; min-width:0; }
.row input[type=number],.row input[type=text],.row select{ flex:1; min-width:0; }
.row .unit{ color:var(--dim); font-size:12px; width:22px; }
.kfbtn{ width:var(--tap); padding:0; background:transparent; border-color:transparent; flex:none; }
.kfbtn i{ display:block; width:12px; height:12px; transform:rotate(45deg); border:2px solid #5a5f70; border-radius:2px; }
.kfbtn.anim i{ border-color:var(--kf); }
.kfbtn.here i{ background:var(--kf); border-color:var(--kf); }
.btnrow{ display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
.btnrow > button{ flex:1 1 auto; }
.seg{ display:flex; gap:0; flex:1; min-width:0; }
.seg button{ flex:1; min-width:0; border-radius:0; padding:0 6px; font-size:13px; }
.seg button:first-child{ border-radius:10px 0 0 10px; } .seg button:last-child{ border-radius:0 10px 10px 0; }
.seg button + button{ border-left-width:0; }
.list{ display:flex; flex-direction:column; gap:4px; margin:6px 0; }
.item{ display:flex; align-items:center; gap:4px; background:var(--panel2); border:1px solid var(--line); border-radius:10px; min-height:48px; padding:2px 4px; }
.item.sel{ border-color:var(--accent); background:#1c2640; }
.item .nm{ flex:1; min-width:0; padding:0 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; min-height:44px; display:flex; align-items:center; }
.item .meta{ color:var(--muted); font-size:11px; margin-left:6px; }
.item button{ flex:none; }
.item .tag{ font-size:10px; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:1px 5px; margin-right:4px; }
.anchor-grid{ display:grid; grid-template-columns:repeat(3,44px); grid-template-rows:repeat(3,44px); gap:2px; }
.anchor-grid button{ min-width:0; padding:0; border-radius:6px; }
.anchor-grid button i{ width:8px; height:8px; border-radius:50%; background:#5a5f70; }
.anchor-grid button.on i{ background:var(--accent); }
.easing-box{ background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:8px; margin-top:6px; }
.easing-box canvas{ width:100%; height:150px; display:block; touch-action:none; border-radius:8px; background:#101116; }
.help{ width:var(--tap); min-width:var(--tap); height:var(--tap); padding:0; border:0; background:transparent; color:var(--muted); font-size:13px; flex:none; }
.help b{ display:inline-flex; width:20px; height:20px; border-radius:50%; border:1px solid #4a4f5e; align-items:center; justify-content:center; font-size:12px; }
.pill{ font-size:11px; padding:2px 8px; border-radius:20px; background:#23283a; color:#b9c6ea; }
.missing{ color:var(--danger); }
.dropzone{ position:fixed; inset:0; background:rgba(91,140,255,.18); border:3px dashed var(--accent); z-index:200; display:none; align-items:center; justify-content:center; font-size:20px; font-weight:700; pointer-events:none; }
.dropzone.on{ display:flex; }

/* dialogs, popover, toast */
.dlg-back{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:100; display:flex; align-items:center; justify-content:center; padding:calc(12px + var(--sat)) 12px calc(12px + var(--sab)); }
.dlg{ background:var(--panel); border:1px solid var(--line); border-radius:16px; width:min(520px,100%); max-height:100%; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.6); }
.dlg header{ padding:14px 16px 8px; font-weight:700; font-size:16px; display:flex; align-items:center; gap:8px; }
.dlg .body{ padding:4px 16px 12px; overflow-y:auto; touch-action:pan-y; -webkit-overflow-scrolling:touch; }
.dlg footer{ padding:10px 16px 14px; display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; border-top:1px solid var(--line); }
.progress{ height:10px; background:#262a35; border-radius:6px; overflow:hidden; margin:10px 0; }
.progress > i{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),#8ab0ff); }
.warnbox{ background:#2e2512; border:1px solid #6b5420; color:#ffe1a6; border-radius:10px; padding:10px 12px; margin:8px 0; font-size:13px; line-height:1.6; }
.infobox{ background:#18213a; border:1px solid #2f4170; color:#d4e0ff; border-radius:10px; padding:10px 12px; margin:8px 0; font-size:13px; line-height:1.6; }
#popover{ position:fixed; z-index:150; max-width:min(320px,calc(100vw - 24px)); background:#2a2e3b; color:#eef; border:1px solid #444a5c; border-radius:10px; padding:10px 12px; font-size:13px; line-height:1.6; box-shadow:0 10px 30px rgba(0,0,0,.5); display:none; }
#popover.on{ display:block; }
#toast{ position:fixed; left:50%; bottom:calc(80px + var(--sab)); transform:translateX(-50%); background:#2a2e3b; border:1px solid #444a5c; padding:10px 16px; border-radius:12px; z-index:160; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s; max-width:calc(100vw - 32px); text-align:center; }
#toast.on{ opacity:1; }

/* self test */
#selftest{ position:fixed; inset:0; overflow:auto; background:var(--bg); padding:calc(16px + var(--sat)) 16px calc(24px + var(--sab)); z-index:300; user-select:text; -webkit-user-select:text; touch-action:pan-y; }
#selftest h1{ font-size:20px; margin:0 0 6px; }
#selftest .sum{ font-size:15px; margin:8px 0 14px; font-weight:700; }
#selftest .t{ border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:10px 12px; margin:6px 0; }
#selftest .t .st{ font-weight:700; margin-right:6px; }
#selftest .t.pass .st{ color:var(--ok); } #selftest .t.fail .st{ color:var(--danger); } #selftest .t.info .st{ color:#8ab0ff; }
#selftest .t pre{ white-space:pre-wrap; word-break:break-all; color:var(--muted); font-size:12px; margin:6px 0 0; }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button class="icon ghost" id="btnMenu" aria-label="メニュー" title="メニュー（新規・開く・保存・セルフテスト）"><svg class="svgi" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="title"><span id="projName">無題のプロジェクト</span><span id="saveStatus">保存済み</span></div>
    <button class="icon ghost" id="btnUndo" aria-label="元に戻す" title="元に戻す（Ctrl+Z）"><svg class="svgi" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="icon ghost" id="btnRedo" aria-label="やり直す" title="やり直す（Ctrl+Shift+Z）"><svg class="svgi" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    <button class="icon ghost" id="btnSettings" aria-label="プロジェクト設定" title="プロジェクト設定（長さ・縦横比・解像度・fps・背景色）"><svg class="svgi" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <button class="primary" id="btnExport" title="MP4 動画として書き出します">書き出し</button>
  </header>
  <div id="main">
    <aside id="leftCol"><div class="side-tabs" id="leftTabs"></div><div class="side-body" id="leftBody"></div></aside>
    <section id="center">

const EASE_CHOICES = ['linear', 'ease-in', 'ease-out', 'ease-in-out', 'cubic-bezier', 'spring'];
function easingEditor(reg, get, set) {
  const box = h('div', { class: 'easing-box' });
  const sel = h('select', { 'aria-label': 'イージング', 'data-testid': 'easing-select' }, EASE_CHOICES.map(k => h('option', { value: k }, EASING_LABELS[k])));
  sel.addEventListener('change', () => edit(() => {
    const cur = get(), k = sel.value;
    if (k === 'cubic-bezier') { const p = typeof cur === 'string' && EASING_PRESETS[cur]; set(p ? { type: 'cubic-bezier', x1: p[0], y1: p[1], x2: p[2], y2: p[3] } : clone(DEFAULT_BEZIER)); }
    else if (k === 'spring') set(clone(DEFAULT_SPRING));
    else set(k);
  }));
  const cv = h('canvas', { 'aria-label': 'イージングカーブ（ベジェの点はドラッグできます）' });
  box.append(h('div', { class: 'row' }, h('label', { class: 'lab static' }, 'イージング'), sel), cv);
  const kind = easingKind(get());
  if (kind === 'cubic-bezier') {
    const g = h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0 8px' } });
    for (const [k, lbl, min, max] of [['x1', 'X1', 0, 1], ['y1', 'Y1', -5, 5], ['x2', 'X2', 0, 1], ['y2', 'Y2', -5, 5]])
      g.append(simpleNumRow(reg, { label: lbl, step: 0.01, min, max, testid: 'bez-' + k, get: () => { const e = get(); return e && e[k]; }, set: v => { const e = get(); if (e) e[k] = round(v, 3); } }));
    box.append(g, h('p', { class: 'note' }, 'グラフの2つの点をドラッグしても調整できます。'));
  } else if (kind === 'spring') {
    const sl = (k, lbl, min, max, step, help) => {
      const r = h('input', { type: 'range', min, max, step, class: 'grow', 'aria-label': lbl, 'data-testid': 'spring-' + k });
      const n = h('span', { class: 'meta', style: { width: '44px', textAlign: 'right' } });
      r.addEventListener('input', () => { beginEdit(); const e = get(); if (e) e[k] = +r.value; invalidate(F.PREVIEW); n.textContent = r.value; });
      r.addEventListener('change', () => endEdit());
      reg(() => { const e = get(); if (e && document.activeElement !== r) r.value = e[k]; n.textContent = e ? String(e[k]) : ''; });
      return h('div', { class: 'row' }, h('label', { class: 'lab static' }, lbl), r, n, helpBtn(help));
    };
    box.append(sl('stiffness', '硬さ', 10, 1000, 1, '大きいほど速く、勢いよく動きます（stiffness）。'),
      sl('damping', '減衰', 1, 100, 0.5, '小さいほどよく揺れ、大きいほど揺れずに止まります（damping）。'),
      sl('mass', '重さ', 0.1, 10, 0.1, '大きいほどゆったり大きく揺れます（mass）。'),
      h('p', { class: 'note' }, 'バネの動きは、次のキーフレームまでの時間に収まるよう自動で伸縮します。'));
  }
  let anim = 0;
  function drawEase(now) {
    if (!cv.isConnected) { anim = 0; return; }
    const e = get();
    const w = cv.clientWidth || 260, hh = cv.clientHeight || 150, dpr = Math.min(devicePixelRatio || 1, 3);
    if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(hh * dpr); }
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, hh);
    let lo = 0, hi = 1;
    const N = 160, ys = [];
    for (let i = 0; i <= N; i++) { const y = applyEasing(e, i / N); ys.push(y); lo = Math.min(lo, y); hi = Math.max(hi, y); }
    if (e && e.type === 'cubic-bezier') { lo = Math.min(lo, e.y1, e.y2); hi = Math.max(hi, e.y1, e.y2); }
    const padL = 14, padR = 46, padY = 14;
    const gx = x => padL + x * (w - padL - padR), gy = y => hh - padY - (y - lo) / (hi - lo) * (hh - padY * 2);
    ctx.strokeStyle = '#2a2d38'; ctx.lineWidth = 1;
    ctx.strokeRect(gx(0), gy(1), gx(1) - gx(0), gy(0) - gy(1));
    ctx.beginPath(); ys.forEach((y, i) => { const X = gx(i / N), Y = gy(y); i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
    ctx.strokeStyle = '#ffc94d'; ctx.lineWidth = 2; ctx.stroke();
    if (e && e.type === 'cubic-bezier') {
      ctx.strokeStyle = 'rgba(91,140,255,.8)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(gx(0), gy(0)); ctx.lineTo(gx(e.x1), gy(e.y1)); ctx.moveTo(gx(1), gy(1)); ctx.lineTo(gx(e.x2), gy(e.y2)); ctx.stroke();
      for (const [x, y] of [[e.x1, e.y1], [e.x2, e.y2]]) { ctx.beginPath(); ctx.arc(gx(x), gy(y), 7, 0, Math.PI * 2); ctx.fillStyle = '#5b8cff'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.stroke(); }
    }
    const period = 1.6, ph = ((now || 0) / 1000) % period, u = clamp(ph / 1.1, 0, 1), v = applyEasing(e, u);
    ctx.beginPath(); ctx.moveTo(gx(u), gy(lo)); ctx.lineTo(gx(u), gy(hi)); ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.stroke();
    ctx.beginPath(); ctx.arc(gx(u), gy(v), 4, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
    const bx = w - padR / 2;
    ctx.strokeStyle = '#3a3e4c'; ctx.beginPath(); ctx.moveTo(bx, gy(0)); ctx.lineTo(bx, gy(1)); ctx.stroke();
    ctx.beginPath(); ctx.arc(bx, gy(v), 9, 0, Math.PI * 2); ctx.fillStyle = '#5b8cff'; ctx.fill();
    cv._map = { gx, gy, lo, hi, padL, padR, padY, w, hh };
    anim = requestAnimationFrame(drawEase);
  }
  cv.addEventListener('pointerdown', ev => {
    const e = get();
    if (!e || e.type !== 'cubic-bezier' || !cv._map) return;
    const r = cv.getBoundingClientRect(), m = cv._map;
    const px = ev.clientX - r.left, py = ev.clientY - r.top;
    const d1 = Math.hypot(m.gx(e.x1) - px, m.gy(e.y1) - py), d2 = Math.hypot(m.gx(e.x2) - px, m.gy(e.y2) - py);
    const which = Math.min(d1, d2) > 30 ? null : d1 <= d2 ? 1 : 2;
    if (!which) return;
    ev.preventDefault();
    dragHelper(ev, { threshold: 1,
      onStart: () => beginEdit(),
      onMove: (dx, dy, mv) => {
        const ee = get(); if (!ee) return;
        const X = clamp((mv.clientX - r.left - m.padL) / (m.w - m.padL - m.padR), 0, 1);
        const Y = clamp(m.lo + (m.hh - m.padY - (mv.clientY - r.top)) / (m.hh - m.padY * 2) * (m.hi - m.lo), -5, 5);
        ee['x' + which] = round(X, 3); ee['y' + which] = round(Y, 3);
        invalidate(F.PREVIEW | F.PANELS);
      },
      onEnd: moved => { if (moved) endEdit(); },
    });
  });
  reg(() => { sel.value = easingKind(get()); if (!anim) anim = requestAnimationFrame(drawEase); });
  return box;
}

/* ---- アニメーションプリセット ---- */
function buildPresetSection(reg, ids) {
  const P = S.project, layers = ids.map(getLayer).filter(Boolean);
  if (!presetDraft.value) presetDraft.value = defaultPreset(P);
  const d = presetDraft.value;
  const out = [h('h3', null, 'アニメーション（プリセット）', helpBtn('登場（イン）や退場（アウト）の動きを、通常の編集できるキーフレームとして作ります。同じ枠にもう一度適用すると前のものと置き換わります（元に戻す で取り消せます）。'))];
  const redraw = () => { invalidate(F.PANELS); };
  const kindSel = h('select', { 'aria-label': 'プリセットの種類', 'data-testid': 'preset-kind' }, Object.entries(PRESET_KINDS).map(([k, v]) => h('option', { value: k }, v)));
  kindSel.value = d.kind;
  kindSel.onchange = () => { presetDraft.value = Object.assign({}, d, { kind: kindSel.value }); redraw(); };
  out.push(h('div', { class: 'row' }, h('label', { class: 'lab static' }, '種類'), kindSel));
  if (d.kind === 'slide') {
    const seg = h('div', { class: 'seg' }, ['left', 'right', 'up', 'down'].map(k => h('button', { type: 'button', class: d.direction === k ? 'on' : '', onclick: () => { presetDraft.value = Object.assign({}, d, { direction: k }); redraw(); } }, DIR_LABEL[k])));
    out.push(h('div', { class: 'row' }, h('label', { class: 'lab static' }, '方向'), seg, helpBtn('イン：その方向から入ってきます。アウト：その方向へ出ていきます。')));
  }
  const draftNum = (label, key, unit, opts = {}) => {
    const f = opts.factor || 1;
    const input = h('input', { type: 'number', step: 'any', 'aria-label': label, 'data-testid': 'preset-' + key, inputmode: opts.neg ? null : 'decimal' });
    input.value = fmtNum(d[key] * f);
    input.addEventListener('change', () => { const v = parseFloat(input.value); if (isNum(v)) d[key] = Math.max(opts.min !== undefined ? opts.min : -Infinity, v / f); });
    return h('div', { class: 'row' }, h('label', { class: 'lab static' }, label), input, h('span', { class: 'unit' }, unit));
  };
  if (d.kind === 'slide') out.push(draftNum('距離', 'distance', 'px', { neg: true }));
  if (d.kind === 'scale') out.push(draftNum('開始/終了の大きさ', 'fromScale', '%', { factor: 100, min: 0 }));
  out.push(draftNum('遅延', 'delay', '秒', { min: 0 }), draftNum('長さ', 'duration', '秒', { min: 0.01 }));
  const ek = easingKind(d.easing);
  const eSel = h('select', { 'aria-label': 'プリセットのイージング' }, ['linear', 'ease-in', 'ease-out', 'ease-in-out', 'spring'].map(k => h('option', { value: k }, EASING_LABELS[k])));
  eSel.value = ek === 'cubic-bezier' ? 'ease-out' : ek;
  eSel.onchange = () => { d.easing = eSel.value === 'spring' ? clone(DEFAULT_SPRING) : eSel.value; };
  out.push(h('div', { class: 'row' }, h('label', { class: 'lab static' }, 'イージング'), eSel));
  const apply = slot => {
    const bad = [];
    edit(() => { for (const L of ids.map(getLayer).filter(Boolean)) if (!applyPreset(P, L, slot, d)) bad.push(L.name); });
    if (bad.length) toast(`${bad.join('、')} にはこの種類は使えません（カーソルはフェード・拡大縮小のみ）`, 3500);
    else toast(slot === 'in' ? '登場アニメーションを適用しました' : '退場アニメーションを適用しました');
  };
  out.push(h('div', { class: 'btnrow' },
    h('button', { type: 'button', class: 'primary', 'data-testid': 'preset-apply-in', onclick: () => apply('in') }, 'イン（登場）に適用'),
    h('button', { type: 'button', 'data-testid': 'preset-apply-out', onclick: () => apply('out') }, 'アウト（退場）に適用')));
  const desc = pr => `${PRESET_KINDS[pr.kind]}${pr.kind === 'slide' ? '（' + DIR_LABEL[pr.direction] + '）' : ''}・${pr.duration}秒`;
  for (const slot of ['in', 'out']) {
    const applied = layers.filter(L => L.presets && L.presets[slot]);
    if (!applied.length) continue;
    out.push(h('div', { class: 'item' }, h('span', { class: 'nm' }, (slot === 'in' ? 'イン：' : 'アウト：') + (applied.length === 1 ? desc(applied[0].presets[slot]) : applied.length + ' 個に適用済み')),
      h('button', { type: 'button', onclick: () => edit(() => { for (const L of ids.map(getLayer).filter(Boolean)) removePresetKfs(L, slot); }) }, '解除')));
  }
  return out;
}

/* =====================================================================
 * 21. MP4 書き出し（WebCodecs H.264 + 自前の MP4 mux）
 * ===================================================================== */
const MP4 = (() => {
  const enc = new TextEncoder();
  const u32 = n => [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255];
  const u16 = n => [(n >>> 8) & 255, n & 255];
  const str = s => [...enc.encode(s)];
  function box(type, ...parts) {
    const bufs = parts.map(p => p instanceof Uint8Array ? p : new Uint8Array(p));
    let len = 8;
    for (const b of bufs) len += b.length;
    const out = new Uint8Array(len), dv = new DataView(out.buffer);
    dv.setUint32(0, len); out.set(enc.encode(type), 4);
    let o = 8;
    for (const b of bufs) { out.set(b, o); o += b.length; }
    return out;
  }
  const full = (type, ver, flags, ...parts) => box(type, [ver, (flags >>> 16) & 255, (flags >>> 8) & 255, flags & 255], ...parts);
  const MATRIX = [0x00010000, 0, 0, 0, 0x00010000, 0, 0, 0, 0x40000000].flatMap(u32);
  function table(entries, width) {
    const out = new Uint8Array(4 + entries.length * width * 4), dv = new DataView(out.buffer);
    dv.setUint32(0, entries.length);
    let o = 4;
    for (const e of entries) for (let k = 0; k < width; k++) { dv.setUint32(o, (width === 1 ? e : e[k]) >>> 0); o += 4; }
    return out;
  }
  /* samples: デコード順の [{ data: Uint8Array(AVCC), key: boolean, pts: µs }] */
  function mux({ width, height, fps, samples, avcC }) {
    const n = samples.length, ts = fps * 1000, delta = 1000;
    const durMs = Math.round(n * 1000 / fps);
    const pts = samples.map(s => Math.round(s.pts * ts / 1e6));
    let reorder = false, minOff = 0;
    for (let i = 0; i < n; i++) { const off = pts[i] - i * delta; if (off) reorder = true; if (off < minOff) minOff = off; }
    const shift = -minOff;
    const stts = full('stts', 0, 0, table([[n, delta]], 2));
    let ctts = null, edts = null;
    if (reorder) {
      const runs = [];
      for (let i = 0; i < n; i++) { const off = pts[i] + shift - i * delta; const last = runs[runs.length - 1]; if (last && last[1] === off) last[0]++; else runs.push([1, off]); }
      ctts = full('ctts', 0, 0, table(runs, 2));
      if (shift) edts = box('edts', full('elst', 0, 0, u32(1), u32(durMs), u32(shift), u32(0x00010000)));
    }
    const keys = []; samples.forEach((s, i) => { if (s.key) keys.push(i + 1); });
    const stss = keys.length === n ? null : full('stss', 0, 0, table(keys, 1));
    const stsz = full('stsz', 0, 0, u32(0), table(samples.map(s => s.data.length), 1));
    const stsc = full('stsc', 0, 0, table([[1, n, 1]], 3));
    const avc1 = box('avc1', [0, 0, 0, 0, 0, 0, 0, 1], new Array(16).fill(0), u16(width), u16(height),
      u32(0x00480000), u32(0x00480000), u32(0), u16(1), new Array(32).fill(0), u16(0x0018), u16(0xffff), box('avcC', avcC),
      box('pasp', u32(1), u32(1)));
    const buildMoov = off => {
      const stco = full('stco', 0, 0, u32(1), u32(off));
      const stbl = box('stbl', full('stsd', 0, 0, u32(1), avc1), stts, ...(ctts ? [ctts] : []), ...(stss ? [stss] : []), stsc, stsz, stco);
      const minf = box('minf', full('vmhd', 0, 1, u16(0), u16(0), u16(0), u16(0)), box('dinf', full('dref', 0, 0, u32(1), full('url ', 0, 1))), stbl);
      const mdia = box('mdia', full('mdhd', 0, 0, u32(0), u32(0), u32(ts), u32(n * delta), u16(0x55c4), u16(0)),
        full('hdlr', 0, 0, u32(0), str('vide'), new Array(12).fill(0), str('VideoHandler'), [0]), minf);
      const tkhd = full('tkhd', 0, 3, u32(0), u32(0), u32(1), u32(0), u32(durMs), new Array(8).fill(0), u16(0), u16(0), u16(0), u16(0), MATRIX, u32(width * 65536), u32(height * 65536));
      const trak = box('trak', tkhd, ...(edts ? [edts] : []), mdia);
      const mvhd = full('mvhd', 0, 0, u32(0), u32(0), u32(1000), u32(durMs), u32(0x00010000), u16(0x0100), new Array(10).fill(0), MATRIX, new Array(24).fill(0), u32(2));
      return box('moov', mvhd, trak);
    };
    const ftyp = box('ftyp', str('isom'), u32(0x200), str('isom'), str('iso2'), str('avc1'), str('mp41'));
    let mdatLen = 8;
    for (const s of samples) mdatLen += s.data.length;
    if (mdatLen > 0xffffffff) throw new Error('動画が大きすぎます（4GB 超）');
    const moovSize = buildMoov(0).length;
    const moov = buildMoov(ftyp.length + moovSize + 8);
    return new Blob([ftyp, moov, new Uint8Array(u32(mdatLen)), enc.encode('mdat'), ...samples.map(s => s.data)], { type: 'video/mp4' });
  }
  /* 説明情報（avcC）が得られない環境向け：NAL を解析して avcC を作る */
  function splitNals(d) {

      const ve = typeof VideoEncoder !== 'undefined';
      let h264 = false;
      if (ve) { try { h264 = !!(await pickEncoderConfig(1920, 1080, 30, 8e6)); } catch (e) { h264 = false; } }
      const mr = typeof MediaRecorder !== 'undefined';
      return `WebCodecs: ${ve ? 'あり' : 'なし'} / H.264 1080p: ${h264 ? '対応' : '非対応'} / MediaRecorder: ${mr ? 'あり' : 'なし'} / OffscreenCanvas: ${typeof OffscreenCanvas !== 'undefined' ? 'あり' : 'なし'} / Wake Lock: ${'wakeLock' in navigator ? 'あり' : 'なし'}`;
    }, true],
  ];
  for (const [name, fn, info] of tests) {
    const row = h('div', { class: 't', 'data-testid': 'selftest-row' }, h('span', { class: 'st' }, '…'), h('b', null, name));
    list.append(row);
    let status = 'pass', detail = '';
    try { detail = String((await fn()) || ''); if (info) status = 'info'; } catch (e) { status = 'fail'; detail = (e && e.message) || String(e); }
    row.classList.add(status);
    row.dataset.status = status;
    row.firstChild.textContent = status === 'pass' ? '✓ 合格' : status === 'fail' ? '✗ 不合格' : 'ℹ 情報';
    row.append(h('pre', null, detail));
    results.push({ name, status, detail });
  }
  const failed = results.filter(r => r.status === 'fail').length, passed = results.filter(r => r.status === 'pass').length;
  sum.textContent = failed ? `${failed} 件 不合格 / ${passed} 件 合格` : `すべて合格（${passed} 件）`;
  sum.style.color = failed ? 'var(--danger)' : 'var(--ok)';
  window.__selfTest = { done: true, passed, failed, results };
}

init();
})();
</script>
