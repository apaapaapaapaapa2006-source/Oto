<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050409">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="カメラの前に立つと自分の影（シルエット）が浮かび上がり、体の動きが12本の光の弦を弾く楽器 - PENUMBRA">
<title>PENUMBRA ─ 影の竪琴</title>
<style>
  :root{
    --void:#050409;
    --haze:#140f22;
    --ghost:#f0eefc;
    --warn:#ff5470;
    --accent:#b8a6ff;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ width:100%; height:100%; background:var(--void); overflow:hidden;
    font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,-apple-system,'Segoe UI',sans-serif; }
  #stage{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  video{ position:absolute; width:2px; height:2px; opacity:0; pointer-events:none; }

  /* ---- Start overlay ---- */
  #overlay{
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 40%, var(--haze) 0%, var(--void) 78%);
    transition:opacity .8s ease, visibility .8s ease; text-align:center; padding:1.5rem;
    overflow:hidden;
  }
  #overlay.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  .orb{ position:absolute; border-radius:50%; filter:blur(42px); opacity:.4; pointer-events:none;
    animation:drift 14s ease-in-out infinite alternate; }
  .orb.o1{ width:38vmin; height:38vmin; left:8%;  top:12%; background:radial-gradient(circle,#8fd8ff,transparent 70%); }
  .orb.o2{ width:46vmin; height:46vmin; right:4%; top:30%; background:radial-gradient(circle,#b8a6ff,transparent 70%); animation-delay:-5s; }
  .orb.o3{ width:34vmin; height:34vmin; left:30%; bottom:6%; background:radial-gradient(circle,#6c8cff,transparent 70%); animation-delay:-9s; }
  @keyframes drift{
    from{ transform:translate(0,0) scale(1); }
    to{ transform:translate(6vmin,-4vmin) scale(1.15); }
  }
  #eyebrow{ color:rgba(240,238,252,0.4); font-size:0.66rem; letter-spacing:0.5em; margin-bottom:1rem; position:relative; }
  #title{
    font-size:2.3rem; font-weight:800; letter-spacing:0.12em; line-height:1.2; position:relative;
    background:linear-gradient(90deg,#b8a6ff,#8fd8ff,#f0eefc,#6c8cff,#b8a6ff);
    background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:flow 8s linear infinite;
    margin-bottom:0.4rem;
  }
  @keyframes flow{ to{ background-position:300% 0; } }
  #sub{ color:rgba(240,238,252,0.55); font-size:0.82rem; letter-spacing:0.08em; margin-bottom:2rem; position:relative; }
  #startBtn{
    position:relative;
    padding:0.95rem 3rem; font-size:1rem; letter-spacing:0.18em; font-family:inherit; font-weight:700;
    color:var(--void); background:linear-gradient(90deg,#b8a6ff,#8fd8ff); border:none; border-radius:100px;
    cursor:pointer; box-shadow:0 0 28px rgba(140,120,255,0.5);
    transition:transform .18s ease, box-shadow .18s ease;
    animation:breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ box-shadow:0 0 22px rgba(140,120,255,0.45); }
    50%{ box-shadow:0 0 44px rgba(143,216,255,0.65); }
  }
  #startBtn:active{ transform:scale(0.96); }
  #hint{
    position:relative;
    margin-top:2.2rem; max-width:22rem; color:rgba(240,238,252,0.5); font-size:0.76rem; line-height:1.9;
    letter-spacing:0.02em; text-align:left;
  }
  #hint b{ color:var(--accent); font-weight:700; }
  #errorMsg{ display:none; position:relative; margin-top:1.4rem; max-width:80%; color:var(--warn); font-size:0.78rem; line-height:1.6; white-space:pre-line; }

  /* ---- HUD ---- */
  #hud{
    position:fixed; z-index:12; left:0; right:0; bottom:0;
    display:flex; align-items:flex-end; justify-content:space-between; padding:0 1rem 1.1rem;
    pointer-events:none; opacity:0; transition:opacity .6s ease;
  }
  #hud.show{ opacity:1; }
  .panel{
    background:rgba(10,8,18,0.42); backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px);
    border:1px solid rgba(184,166,255,0.16); border-radius:16px; padding:0.65rem 0.9rem;
    color:var(--ghost); min-width:120px;
  }
  .panel .lab{ font-size:0.58rem; letter-spacing:0.22em; color:rgba(240,238,252,0.5); margin-bottom:0.3rem; }
  .panel .cnt{ font-size:1.7rem; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  .panel .cnt small{ font-size:0.7rem; font-weight:600; color:rgba(240,238,252,0.55); margin-left:.15rem; }
  .meter{ height:3px; border-radius:2px; background:rgba(240,238,252,0.1); margin-top:0.5rem; overflow:hidden; }
  .meter b{ display:block; height:100%; width:0%;
    background:linear-gradient(90deg,#b8a6ff,#8fd8ff); border-radius:2px;
    transition:width .12s linear; }
  .tim{ font-size:0.62rem; letter-spacing:0.08em; margin-top:0.4rem; color:var(--accent); min-height:0.85em; }
  .panel[data-side="r"] .tim{ text-align:right; }

  #centerHud{
    position:fixed; z-index:12; left:50%; bottom:1.5rem; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:.3rem; pointer-events:none;
    opacity:0; transition:opacity .6s ease;
  }
  #centerHud.show{ opacity:1; }
  #stateDot{
    font-size:0.68rem; letter-spacing:0.2em; color:rgba(240,238,252,0.6); font-weight:700;
    padding:0.4rem 1.1rem; border-radius:100px; border:1px solid rgba(184,166,255,0.16);
    background:rgba(10,8,18,0.4); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    transition:color .25s ease, border-color .25s ease, box-shadow .25s ease;
    white-space:nowrap;
  }
  #stateDot.playing{ color:#8fd8ff; border-color:rgba(143,216,255,0.5); box-shadow:0 0 18px rgba(143,216,255,0.25); }
  #stateDot.silent{ color:#ff5470; border-color:rgba(255,84,112,0.45); box-shadow:none; }

  /* ---- top controls ---- */
  #topbar{ position:fixed; z-index:12; top:0; right:0; padding:1rem 1rem 0; display:flex; gap:.55rem;
    opacity:0; transition:opacity .6s ease; }
  #topbar.show{ opacity:1; }
  .btn{
    pointer-events:auto; font-family:inherit; font-size:0.68rem; letter-spacing:0.1em; font-weight:700;
    color:var(--ghost); background:rgba(10,8,18,0.5); border:1px solid rgba(184,166,255,0.18);
    border-radius:100px; padding:0.5rem 0.9rem; cursor:pointer; backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px); transition:transform .15s ease, background .15s ease;
  }
  .btn:active{ transform:scale(0.94); }
  .btn.active{ background:rgba(184,166,255,0.16); border-color:rgba(184,166,255,0.5); color:var(--accent); }
  #brand{ position:fixed; z-index:12; top:0; left:0; padding:1.15rem 0 0 1.15rem; pointer-events:none;
    opacity:0; transition:opacity .6s ease; }
  #brand.show{ opacity:1; }
  #brand .b1{ font-size:0.66rem; font-weight:800; letter-spacing:0.34em; color:rgba(240,238,252,0.85); }
  #brand .b2{ font-size:0.56rem; letter-spacing:0.24em; color:rgba(240,238,252,0.4); margin-top:.2rem; }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <video id="video" playsinline muted></video>

  <div id="brand"><div class="b1">PENUMBRA</div><div class="b2">影の竪琴 / 体で奏でる</div></div>

  <div id="topbar">
    <button class="btn" id="flipBtn">⟲ カメラ</button>
    <button class="btn" id="trailBtn">残光 ON</button>
  </div>

  <div id="hud">
    <div class="panel" data-side="l">
      <div class="lab">SHADOW / 影</div>
      <div class="cnt"><span id="covCount">0</span><small>%</small></div>
      <div class="meter"><b id="covMeter"></b></div>
      <div class="tim" id="covTim">気配なし</div>
    </div>
    <div class="panel" data-side="r" style="text-align:right">
      <div class="lab">STRINGS / 弦</div>
      <div class="cnt"><span id="strCount">0</span><small>/12</small></div>
      <div class="meter"><b id="strMeter"></b></div>
      <div class="tim" id="strTim">――</div>
    </div>
  </div>

  <div id="centerHud">
    <div id="stateDot">WAITING</div>
  </div>

  <div id="overlay">
    <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
    <div id="eyebrow">CAMERA INSTRUMENT</div>
    <div id="title">PENUMBRA</div>
    <div id="sub">影の竪琴 — 体で奏でる光と音</div>
    <button id="startBtn">はじめる</button>
    <div id="hint">
      ・カメラの前に立つと、あなたの<b>影（シルエット）</b>が浮かび上がります<br>
      ・画面には<b>12本の光の弦</b>が影の輪郭に沿って並んでいます<br>
      ・体を動かして弦の高さを<b>すり抜ける</b>と、その弦の音が鳴ります<br>
      ・両腕を広げて<b>影を大きく</b>すると、伴奏のドローンが厚くなります<br>
      ・カメラの前から離れると、静寂に戻ります
    </div>
    <div id="errorMsg"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------------------
  //  DOM
  // ---------------------------------------------------------------------------
  const canvas   = document.getElementById('stage');
  const ctx      = canvas.getContext('2d');
  const video    = document.getElementById('video');
  const overlay  = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const errorMsg = document.getElementById('errorMsg');
  const hud      = document.getElementById('hud');
  const topbar   = document.getElementById('topbar');
  const brand    = document.getElementById('brand');
  const centerHud= document.getElementById('centerHud');
  const stateDot = document.getElementById('stateDot');
  const flipBtn  = document.getElementById('flipBtn');
  const trailBtn = document.getElementById('trailBtn');
  const covCountEl = document.getElementById('covCount');
  const covMeterEl = document.getElementById('covMeter');
  const covTimEl   = document.getElementById('covTim');
  const strCountEl = document.getElementById('strCount');
  const strMeterEl = document.getElementById('strMeter');
  const strTimEl   = document.getElementById('strTim');

  // glow layer (trails) — drawn additively over the darkened video
  const fx   = document.createElement('canvas');
  const fctx = fx.getContext('2d');

  let W = 0, H = 0, DPR = 1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    fx.width = W * DPR; fx.height = H * DPR;
    fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------------------------------------------------------------------------
  //  SILHOUETTE SAMPLING
  //  a low-res offscreen canvas receives the segmentation mask each frame;
  //  we scan it column by column to find the topmost point of the body's
  //  silhouette — a "skyline". 12 of those columns double as harp strings.
  // ---------------------------------------------------------------------------
  const MASK_W = 48, MASK_H = 32, MASK_THRESH = 90;
  const NUM_STRINGS = 12;
  const GROUP = MASK_W / NUM_STRINGS; // 4 sample columns per string

  const maskCanvas = document.createElement('canvas');
  maskCanvas.width = MASK_W; maskCanvas.height = MASK_H;
  const maskCtx = maskCanvas.getContext('2d', { willReadFrequently: true });

  const RESULT = { reach: new Array(MASK_W).fill(0), coverage: 0, centroidX: 0.5, t: 0 };

  function onSegResults(results){
    if (!results || !results.segmentationMask) return;
    try { maskCtx.drawImage(results.segmentationMask, 0, 0, MASK_W, MASK_H); }
    catch(e){ return; }
    let data;
    try { data = maskCtx.getImageData(0, 0, MASK_W, MASK_H).data; }
    catch(e){ return; }

    const topRow = new Array(MASK_W).fill(-1);
    let covered = 0, sumX = 0, sumXCount = 0;
    for (let y = 0; y < MASK_H; y++){
      for (let x = 0; x < MASK_W; x++){
        const v = data[(y * MASK_W + x) * 4];
        if (v > MASK_THRESH){
          covered++; sumX += x; sumXCount++;
          if (topRow[x] === -1) topRow[x] = y;
        }
      }
    }
    const reach = new Array(MASK_W);
    for (let x = 0; x < MASK_W; x++){
      reach[x] = topRow[x] === -1 ? 0 : Math.max(0, Math.min(1, 1 - topRow[x] / MASK_H));
    }
    RESULT.reach = reach;
    RESULT.coverage = covered / (MASK_W * MASK_H);
    RESULT.centroidX = sumXCount ? (sumX / sumXCount) / MASK_W : 0.5;
    RESULT.t = performance.now();
  }

  // ---------------------------------------------------------------------------
  //  AUDIO ENGINE
  //  12 harp strings span the screen, pitched low->high left-to-right on the
  //  mirrored (front-camera) view. moving your silhouette up through a
  //  string's height range plucks it; overall body coverage swells a pad.
  // ---------------------------------------------------------------------------
  let actx = null, master = null, comp = null, panNode = null;
  let filter = null, voiceGain = null;
  let delay = null, fbGain = null, wet = null;
  let convolver = null, revGain = null, pluckBus = null;
  let padOsc1 = null, padOsc2 = null, padGain = null;
  const stringOsc = [], stringGain = [], stringSemi = [];
  let audioReady = false;

  const ROOT = 130.81; // C3
  const STEPS = [0, 3, 5, 7, 10]; // minor pentatonic
  const SCALE = Array.from({ length: NUM_STRINGS }, (_, n) => STEPS[n % STEPS.length] + 12 * Math.floor(n / STEPS.length));
  const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

  function midiRatio(semi){ return Math.pow(2, semi / 12); }
  function noteName(semi){
    const midi = 48 + semi; // C3 = MIDI 48
    return NOTE_NAMES[((midi % 12) + 12) % 12] + (Math.floor(midi / 12) - 1);
  }

  function makeImpulse(seconds, decayPow){
    const rate = actx.sampleRate, len = Math.floor(rate * seconds);
    const buf = actx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++){
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decayPow);
    }
    return buf;
  }

  function buildAudio(){
    if (audioReady) return;
    actx = new (window.AudioContext || window.webkitAudioContext)();

    master = actx.createGain(); master.gain.value = 0.0;
    panNode = actx.createStereoPanner ? actx.createStereoPanner() : actx.createGain();
    comp = actx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 22; comp.ratio.value = 3.2;
    comp.attack.value = 0.004;  comp.release.value = 0.25;

    filter = actx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 900; filter.Q.value = 4;

    voiceGain = actx.createGain(); voiceGain.gain.value = 0.9;
    filter.connect(voiceGain);

    // 12 harp-string voices, pitched low->high left-to-right on screen
    // (mapping assumes the default mirrored front-camera view)
    for (let i = 0; i < NUM_STRINGS; i++){
      const pitchIdx = NUM_STRINGS - 1 - i;
      const semi = SCALE[pitchIdx];
      const o = actx.createOscillator(); o.type = 'triangle'; o.frequency.value = ROOT * midiRatio(semi);
      const g = actx.createGain(); g.gain.value = 0.0001;
      o.connect(g); g.connect(filter);
      o.start();
      stringOsc.push(o); stringGain.push(g); stringSemi.push(semi);
    }

    // low pad — swells with how much of the frame your silhouette fills
    padOsc1 = actx.createOscillator(); padOsc1.type = 'sine'; padOsc1.frequency.value = ROOT / 2;
    padOsc2 = actx.createOscillator(); padOsc2.type = 'sine'; padOsc2.frequency.value = ROOT / 2; padOsc2.detune.value = 6;
    padGain = actx.createGain(); padGain.gain.value = 0.0001;
    padOsc1.connect(padGain); padOsc2.connect(padGain); padGain.connect(filter);
    padOsc1.start(); padOsc2.start();

    // misty feedback delay
    delay  = actx.createDelay(1.0); delay.delayTime.value = 0.36;
    fbGain = actx.createGain();     fbGain.gain.value = 0.32;
    wet    = actx.createGain();     wet.gain.value = 0.26;
    voiceGain.connect(delay); delay.connect(fbGain); fbGain.connect(delay); delay.connect(wet);

    // soft hall reverb
    convolver = actx.createConvolver();
    convolver.buffer = makeImpulse(2.6, 2.3);
    revGain = actx.createGain(); revGain.gain.value = 0.36;
    voiceGain.connect(convolver);
    convolver.connect(revGain); revGain.connect(master);

    // pluck bell bus (fed when a string is struck)
    pluckBus = actx.createGain(); pluckBus.gain.value = 0.9;
    pluckBus.connect(master); pluckBus.connect(convolver);

    voiceGain.connect(master);
    wet.connect(master);
    master.connect(panNode); panNode.connect(comp); comp.connect(actx.destination);

    audioReady = true;
  }

  function pluck(freq){
    if (!audioReady) return;
    const t = actx.currentTime;
    for (const [ratio, amp, dur] of [[1, 0.24, 0.7], [2.01, 0.1, 0.45], [3.5, 0.045, 0.28]]){
      const o = actx.createOscillator(); o.type = 'sine'; o.frequency.value = freq * ratio;
      const g = actx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(amp, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(pluckBus);
      o.start(t); o.stop(t + dur + 0.1);
    }
  }

  function applyAudio(stringTargets, coverage, avgReach, panX, silent){
    if (!audioReady) return;
    const t = actx.currentTime;

    for (let i = 0; i < NUM_STRINGS; i++){
      stringGain[i].gain.setTargetAtTime(silent ? 0.0001 : stringTargets[i], t, 0.09);
    }
    const presenceNorm = Math.min(1, coverage / 0.35);
    padGain.gain.setTargetAtTime(silent ? 0.0001 : (0.04 + presenceNorm * 0.2), t, 0.18);
    filter.frequency.setTargetAtTime(300 + avgReach * 3200, t, 0.08);

    if (panNode.pan){
      panNode.pan.setTargetAtTime(Math.max(-1, Math.min(1, (panX * 2 - 1) * 0.6)), t, 0.2);
    }

    const vol = silent ? 0 : (0.13 + Math.min(1, coverage / 0.4) * 0.32);
    master.gain.setTargetAtTime(vol, t, silent ? 0.4 : 0.1);
  }

  // ---------------------------------------------------------------------------
  //  CAMERA
  // ---------------------------------------------------------------------------
  let mpCamera = null, facing = 'user', mirror = true, running = false, seg = null;

  function initSeg(){
    seg = new SelfieSegmentation({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}` });
    seg.setOptions({ modelSelection: 1 });
    seg.onResults(onSegResults);
  }

  async function startStream(){
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    mirror = (facing === 'user');
  }

  async function startCameraLoop(){
    if (mpCamera) { mpCamera.stop && mpCamera.stop(); mpCamera = null; }
    mpCamera = new Camera(video, {
      onFrame: async () => { if (running) await seg.send({ image: video }); },
      width: 1280, height: 720
    });
    mpCamera.start();
  }

  async function flipCamera(){
    facing = (facing === 'user') ? 'environment' : 'user';
    try { await startStream(); } catch(e){ /* keep previous */ }
  }
  flipBtn.addEventListener('click', flipCamera);

  let trailOn = true;
  trailBtn.addEventListener('click', () => {
    trailOn = !trailOn;
    trailBtn.textContent = trailOn ? '残光 ON' : '残光 OFF';
    trailBtn.classList.toggle('active', trailOn);
  });

  // ---------------------------------------------------------------------------
  //  RENDER
  // ---------------------------------------------------------------------------
  function pxN(xNorm){ return mirror ? (1 - xNorm) * W : xNorm * W; }

  function drawVideoBase(){
    ctx.save();
    if (mirror){ ctx.translate(W, 0); ctx.scale(-1, 1); }
    const vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
    const scale = Math.max(W / vw, H / vh);
    const dw = vw * scale, dh = vh * scale;
    const dx = (W - dw) / 2, dy = (H - dh) / 2;
    try { ctx.drawImage(video, dx, dy, dw, dh); } catch(e){}
    ctx.restore();

    ctx.fillStyle = 'rgba(5,4,10,0.5)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = 'rgba(28,20,50,0.58)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';

    const vg = ctx.createRadialGradient(W/2, H*0.46, Math.min(W,H)*0.18, W/2, H*0.5, Math.max(W,H)*0.72);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(3,2,7,0.82)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }

  // ---- particles: sparkles at a pluck point ----
  const parts = [];
  const MAX_PARTS = 140;
  function spawnSpark(x, y, hue){
    if (parts.length >= MAX_PARTS) return;
    for (let i = 0; i < 6; i++){
      const a = Math.random() * Math.PI * 2;
      const s = 0.6 + Math.random() * 1.8;
      parts.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 0.3, life: 1,
        decay: 0.014 + Math.random()*0.02, r: 1 + Math.random()*2.2, hue });
    }
  }
  function updateDrawParts(){
    for (let i = parts.length - 1; i >= 0; i--){
      const p = parts[i];
      p.x += p.vx; p.y += p.vy; p.vy -= 0.005; p.life -= p.decay;
      if (p.life <= 0){ parts.splice(i,1); continue; }
      fctx.fillStyle = `hsla(${p.hue},95%,${60+p.life*25}%,${p.life*0.85})`;
      fctx.beginPath(); fctx.arc(p.x, p.y, p.r*p.life, 0, Math.PI*2); fctx.fill();
    }
  }

  // ---- ripples on pluck ----
  const ripples = [];
  function spawnRipple(x, y, hue){ ripples.push({ x, y, r: 6, hue, a: 0.85 }); }
  function updateDrawRipples(){
    for (let i = ripples.length - 1; i >= 0; i--){
      const rp = ripples[i];
      rp.r += 5; rp.a *= 0.9;
      if (rp.a < 0.02){ ripples.splice(i,1); continue; }
      fctx.strokeStyle = `hsla(${rp.hue},95%,72%,${rp.a})`;
      fctx.lineWidth = 2.2;
      fctx.beginPath(); fctx.arc(rp.x, rp.y, rp.r, 0, Math.PI*2); fctx.stroke();
    }
  }

  // skyline: a filled/glowing contour tracing the top of the silhouette
  function drawSkyline(smoothReach, silent){
    const pts = [];
    for (let x = 0; x < MASK_W; x++){
      pts.push([ pxN((x + 0.5) / MASK_W), (1 - smoothReach[x]) * H ]);
    }
    pts.sort((a, b) => a[0] - b[0]);
    if (!pts.length) return;

    const c = fctx;
    c.save();
    c.globalCompositeOperation = 'lighter';

    const grad = c.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, silent ? 'hsla(255,20%,55%,0.18)' : 'hsla(258,90%,74%,0.5)');
    grad.addColorStop(1, 'hsla(258,90%,74%,0)');
    c.beginPath();
    c.moveTo(pts[0][0], H);
    for (const [x, y] of pts) c.lineTo(x, y);
    c.lineTo(pts[pts.length - 1][0], H);
    c.closePath();
    c.fillStyle = grad;
    c.fill();

    c.shadowBlur = silent ? 6 : 22;
    c.shadowColor = silent ? 'rgba(150,140,190,0.35)' : 'rgba(216,204,255,0.9)';
    c.strokeStyle = silent ? 'rgba(190,180,220,0.35)' : 'rgba(232,224,255,0.9)';
    c.lineWidth = 2.2;
    c.beginPath();
    pts.forEach(([x, y], i) => i === 0 ? c.moveTo(x, y) : c.lineTo(x, y));
    c.stroke();
    c.shadowBlur = 0;
    c.restore();
  }

  function drawStrings(stringSmooth, stringFlash){
    const c = fctx;
    c.save();
    c.globalCompositeOperation = 'lighter';
    for (let i = 0; i < NUM_STRINGS; i++){
      const sx = pxN((i + 0.5) / NUM_STRINGS);
      const flash = stringFlash[i];
      const hue = 200 + (i / NUM_STRINGS) * 160;
      const alpha = Math.min(1, 0.08 + stringSmooth[i] * 0.5 + flash * 0.65);
      c.shadowBlur = 6 + flash * 22;
      c.shadowColor = `hsla(${hue},90%,72%,${alpha})`;
      c.strokeStyle = `hsla(${hue},90%,${70 + flash*18}%,${alpha})`;
      c.lineWidth = 1.3 + flash * 3.2;
      c.beginPath(); c.moveTo(sx, 0); c.lineTo(sx, H); c.stroke();
    }
    c.shadowBlur = 0;
    c.restore();
  }

  // ---------------------------------------------------------------------------
  //  MAIN LOOP
  // ---------------------------------------------------------------------------
  const smoothReach = new Array(MASK_W).fill(0);
  const stringSmooth = new Array(NUM_STRINGS).fill(0);
  const stringPrev = new Array(NUM_STRINGS).fill(0);
  const stringFlash = new Array(NUM_STRINGS).fill(0);
  const stringCooldown = new Array(NUM_STRINGS).fill(0);
  const stringTargets = new Array(NUM_STRINGS).fill(0.0001);
  const PLUCK_VELOCITY = 0.05;
  const PLUCK_COOLDOWN = 150;

  let lastPluckName = null;

  function frame(){
    requestAnimationFrame(frame);
    ctx.clearRect(0, 0, W, H);
    drawVideoBase();

    fctx.save();
    fctx.setTransform(1, 0, 0, 1, 0, 0);
    fctx.globalCompositeOperation = 'destination-out';
    fctx.fillStyle = trailOn ? 'rgba(0,0,0,0.14)' : 'rgba(0,0,0,0.4)';
    fctx.fillRect(0, 0, fx.width, fx.height);
    fctx.restore();

    const t = performance.now();
    const fresh = (t - RESULT.t) < 500;
    const rawReach = fresh ? RESULT.reach : null;
    const coverage = fresh ? RESULT.coverage : 0;
    const centroidX = fresh ? RESULT.centroidX : 0.5;
    const silent = coverage < 0.02;

    for (let x = 0; x < MASK_W; x++){
      const r = rawReach ? (rawReach[x] || 0) : 0;
      smoothReach[x] = smoothReach[x] * 0.65 + r * 0.35;
    }

    let activeCount = 0, reachSum = 0, activeReachSum = 0;
    for (let i = 0; i < NUM_STRINGS; i++){
      let sum = 0;
      for (let k = 0; k < GROUP; k++) sum += smoothReach[i * GROUP + k];
      const val = sum / GROUP;
      stringSmooth[i] = val;
      reachSum += val;

      const velocity = val - stringPrev[i];
      const isActive = val > 0.06;
      if (isActive){ activeCount++; activeReachSum += val; }

      if (isActive && velocity > PLUCK_VELOCITY && (t - stringCooldown[i]) > PLUCK_COOLDOWN){
        stringCooldown[i] = t;
        stringFlash[i] = 1;
        const semi = stringSemi[i];
        pluck(ROOT * midiRatio(semi));
        lastPluckName = noteName(semi);
        const sx = pxN((i + 0.5) / NUM_STRINGS);
        const sy = (1 - val) * H;
        const hue = 200 + (i / NUM_STRINGS) * 160;
        spawnSpark(sx, sy, hue);
        spawnRipple(sx, sy, hue);
      }
      stringPrev[i] = val;
      stringFlash[i] *= 0.88;

      stringTargets[i] = isActive ? (0.05 + val * 0.3) : 0.0001;
    }
    const avgReach = activeCount ? activeReachSum / activeCount : reachSum / NUM_STRINGS;

    drawSkyline(smoothReach, silent);
    drawStrings(stringSmooth, stringFlash);
    updateDrawParts();
    updateDrawRipples();

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'screen';
    ctx.drawImage(fx, 0, 0);
    ctx.restore();

    const panX = mirror ? 1 - centroidX : centroidX;
    applyAudio(stringTargets, coverage, avgReach, panX, silent);

    // HUD
    covCountEl.textContent = Math.round(coverage * 100);
    covMeterEl.style.width = Math.min(100, Math.round(coverage / 0.5 * 100)) + '%';
    covTimEl.textContent = silent ? '気配なし' : `重心 ${Math.round(panX*100)}%`;
    strCountEl.textContent = activeCount;
    strMeterEl.style.width = Math.round(activeCount / NUM_STRINGS * 100) + '%';
    strTimEl.textContent = lastPluckName ? `直近: ${lastPluckName}` : '――';

    if (silent){
      stateDot.textContent = 'カメラの前に立ってください';
      stateDot.className = 'silent';
    } else {
      stateDot.textContent = `♪ ${activeCount}弦 ・ ${lastPluckName || '――'}`;
      stateDot.className = 'playing';
    }
  }

  // ---------------------------------------------------------------------------
  //  BOOT
  // ---------------------------------------------------------------------------
  async function boot(){
    startBtn.disabled = true;
    startBtn.textContent = '起動中…';
    try {
      if (typeof SelfieSegmentation === 'undefined' || typeof Camera === 'undefined'){
        throw new Error('人物検出ライブラリ（MediaPipe）を読み込めませんでした。オンライン環境で開いてください。');
      }
      buildAudio();
      if (actx.state === 'suspended') await actx.resume();
      if (!seg) initSeg();
      await startStream();
      await startCameraLoop();
      running = true;

      overlay.classList.add('hidden');
      hud.classList.add('show');
      topbar.classList.add('show');
      brand.classList.add('show');
      centerHud.classList.add('show');
      trailBtn.classList.add('active');
      requestAnimationFrame(frame);
    } catch(err){
      startBtn.disabled = false;
      startBtn.textContent = 'はじめる';
      errorMsg.style.display = 'block';
      errorMsg.textContent = 'カメラを起動できませんでした：' + (err && err.message ? err.message : err) +
        '\nHTTPS または localhost で開き、カメラの使用を許可してください。';
    }
  }
  startBtn.addEventListener('click', boot);
})();
</script>
</body>
</html>
